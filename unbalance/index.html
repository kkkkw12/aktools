<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>失衡位移逐帧模拟器</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f7f7f5; --bd:#e2e0da; --bd2:#c9c6bd;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#8a887f;
  --ok:#3b6d11; --okbg:#eaf3de; --warn:#854f0b; --warnbg:#faeeda;
  --info:#185fa5; --infobg:#e6f1fb; --bad:#a32d2d; --badbg:#fcebeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--tx);
  font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 18px;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:500;margin:0}
header .sub{font-size:12px;color:var(--tx2)}
.legend{font-size:11px;color:var(--tx3);margin-left:auto}
.legend b{font-weight:500}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
/* ★ minmax(0,1fr)：1fr = minmax(auto,1fr)，自动最小尺寸会被 evtbl/frtbl 的 nowrap 宽表顶开
   ⇒ 窄屏整页横向溢出、连 .svgfit 的 width:100% 都失效。0 最小尺寸才能真收缩。 */
@media(max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)} .grid2>div{min-width:0}}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:500;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
label{font-size:12px;color:var(--tx2);min-width:74px}
input,select{font:12px inherit;padding:3px 6px;border:1px solid var(--bd2);border-radius:5px;background:var(--bg);color:var(--tx)}
input[type=number]{width:64px}
input:disabled{background:var(--bg2);color:var(--tx3);border-color:var(--bd)}
button{font:12px inherit;padding:4px 10px;border:1px solid var(--bd2);border-radius:6px;background:var(--bg);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--info);color:var(--info)}
button.on{background:var(--infobg);border-color:var(--info);color:var(--info)}
button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--bd)}
button:disabled:hover{border-color:var(--bd);color:var(--tx)}
button.primary{background:var(--infobg);border-color:var(--info);color:var(--info)}
.presets button{margin:0 4px 4px 0}
.hint{font-size:11px;color:var(--tx3)}
.warnbox{border:1px dashed var(--warn);background:var(--warnbg);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--warn);margin-top:8px}
.okbox{border:1px solid var(--bd);background:var(--okbg);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:right;white-space:nowrap}
th{color:var(--tx2);font-weight:500;text-align:right;background:var(--bg2)}
td.l,th.l{text-align:left}
.mono{font-family:ui-monospace,Consolas,monospace}
.tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:11px}
.tag.reg{background:var(--bg2);color:var(--tx2)}
.tag.toi{background:var(--infobg);color:var(--info)}
.tag.ccd{background:var(--warnbg);color:var(--warn)}
.tag.free{color:var(--tx3)}
.g{color:var(--ok)} .y{color:var(--warn)} .r{color:var(--bad)}
details{margin-top:6px}
summary{cursor:pointer;font-size:12px;color:var(--info)}
.steps{font-size:11px;background:var(--bg2);border-radius:6px;padding:8px 10px;margin:4px 0}
.steps div{padding:1px 0}
.tsub{margin:3px 0 6px 12px;padding:4px 8px;border-left:2px solid var(--bd2)}
.titer{font-weight:500;color:var(--tx2);margin:4px 0 1px}
.trow{font-family:ui-monospace,Consolas,monospace;color:var(--tx)}
.wtag{display:inline-block;background:var(--infobg);color:var(--info);border-radius:3px;padding:0 4px;margin-right:4px}
.tdir{color:var(--warn)}
.tdtl{margin:2px 0 0}
.tdtl summary{font-size:11px;color:var(--tx3)}
#map{border:1px solid var(--bd);border-radius:8px;background:var(--bg);display:block}
textarea{width:100%;height:90px;font:11px ui-monospace,Consolas,monospace;border:1px solid var(--bd2);border-radius:6px;padding:6px;background:var(--bg);color:var(--tx)}
.selftest td.pass{background:var(--okbg)} .selftest td.fail{background:var(--badbg)}
.pane{display:none}.pane.on{display:block}
table.evtbl{font-size:12px}
table.evtbl th,table.evtbl td{padding:3px 5px;vertical-align:middle}
table.evtbl tr.sel{background:var(--infobg)}
table.evtbl input,table.evtbl select{font-size:12px;padding:2px 4px}
table.evtbl td select{padding:2px 3px}
.modtag{display:inline-block;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;
  padding:0 6px;font-size:11px;color:var(--tx2);margin-right:6px}

/* ── 移动端适配（容器宽度 < 860px 生效；桌面端不受影响）──
   ① 两张 SVG（#map 地图 / #track 轨迹）加 class=svgfit：按 viewBox 等比缩放铺满列宽。
      #map 是唯一有点击交互的 SVG，它的坐标换算已改为 getScreenCTM ⇒ 与显示尺寸解耦，缩放后落点仍准。
   ② 触控尺寸：按钮 / 输入框抬到 ≥36px 高，避免手指点不中。
   ③ 字号：一般输入框取 16px —— iOS Safari 在 font-size<16px 的输入框聚焦时会自动放大整页。
      例外：事件表（evtbl）是密集型编辑面，列太多，取 14px 优先保住一屏信息量，
      代价是 iOS 上聚焦那些小格会触发自动缩放（有意取舍，非遗漏）。 */
.svgfit{display:block;width:100%;max-width:546px;height:auto}
#map{touch-action:manipulation}
#selfbox{overflow-x:auto}
@media (max-width:860px){
  .wrap{padding:8px 10px}
  .grid2{gap:10px}
  header{padding:10px 12px;gap:8px}
  header h1{font-size:15px}
  header .sub{font-size:12px}
  .legend{font-size:11px;margin-left:0;width:100%}
  .card{padding:10px 12px;margin-bottom:10px}
  .card h2{font-size:13px}
  body{font-size:14px}
  .row{gap:6px}
  label{font-size:13px;min-width:64px}
  input,select{font-size:16px;padding:6px 8px;min-height:36px}
  input[type=number]{width:80px}
  button{font-size:14px;padding:8px 14px;min-height:36px}
  table{font-size:13px}
  th,td{padding:5px 7px}
  table.evtbl input,table.evtbl select{font-size:14px;padding:4px 5px;min-height:32px}
  textarea{font-size:14px;height:110px}
  .hint{font-size:12px}
  .warnbox,.okbox{font-size:12px}
  .steps{font-size:12px}
}
  /* 说明浮窗 */
  .nref{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    line-height:1;border-radius:50%;border:1px solid var(--bd2);background:var(--bg);
    color:var(--tx3);font-size:10px;cursor:pointer;padding:0;vertical-align:1px;flex:none}
  .nref:hover{border-color:var(--info);color:var(--info)}
  #popover{position:fixed;display:none;z-index:20;flex-direction:column;overflow:hidden;
    background:var(--bg);border:1px solid var(--bd);border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.18)}
  #popover.open{display:flex}
  #popover .ph{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--bd)}
  #popover .ph b{font-size:13px;font-weight:500}
  #popover .ph .sp{flex:1}
  #popover .pb{overflow:auto;padding:12px 14px 20px;flex:1 1 auto;font-size:12px;line-height:1.75;color:var(--tx2)}
  #popover .pb h4{font-size:12.5px;margin:14px 0 4px;color:var(--info);border-bottom:1px solid var(--bd);scroll-margin-top:8px}
  #popover .pb h4:first-child{margin-top:0}
  #popover .pb .bd b{color:var(--tx);font-weight:500}
  #popover .pb code,#popover .pb .mono{font-family:ui-monospace,Consolas,monospace;
    background:var(--bg2);border:1px solid var(--bd);border-radius:3px;padding:0 3px;font-size:11px}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19;display:none}
  #scrim.open{display:block}
  @media (max-width:860px){.nref{width:20px;height:20px;font-size:12px}}
</style>
</head>
<body>
<header>
  <h1>失衡位移逐帧模拟器</h1>
  <span class="sub">复现游戏物理步 · 与实测逐帧对照</span>
  <span class="legend"><b>✅</b> 机制级 &nbsp; <b>★</b> 实测定标 &nbsp; <b>▶</b> 直接读出 &nbsp; <b>⚠</b> 推断未验证（虚线框）<button class="nref" data-note="legend" title="标记含义">?</button></span>
  <button id="allNotesBtn">📖 全部说明</button>
</header>

<div class="wrap">
<div class="grid2">
  <div>

    <div class="card">
      <h2><span class="modtag">①</span>地形编辑 <span class="hint" style="font-weight:400">— 点击格子切换 墙 / 空地</span><button class="nref" data-note="src-points" title="两个「源」是不同的点">?</button></h2>
      <svg id="map" class="svgfit" viewBox="0 0 546 378" width="546" height="378"></svg>
      <div class="row" style="margin-top:8px">
        <span class="hint">预设场景：</span>
        <span class="presets" id="presets"></span>
      </div>
      <div class="row">
        <span class="hint">点地图放置：</span>
        <button id="putEnemy" class="on">敌人起点</button>
        <button id="putEff">效果源</button>
        <button id="putForce">力起点(力源)</button>
        <span class="hint" id="putHint"></span>
      </div>
    </div>

    <div class="card">
      <h2><span class="modtag">③</span>失衡事件序列 <span class="hint" style="font-weight:400">— 每行一个施力事件；同一序列可含多个力，各自按自身管道择帧生效</span><button class="nref" data-note="ev-timing" title="命中帧之后第几帧才有位移">?</button><button class="nref" data-note="dir-mode" title="方向模式与溅射降级">?</button></h2>
      <div class="row">
        <button class="primary" id="addProj">＋ 弹道推力</button>
        <button id="addDirect">＋ 非弹道推力</button>
        <button id="addPull">＋ 拉力</button>
        <span class="hint" id="evHint"></span>
      </div>
      <div style="overflow:auto"><table id="evtbl" class="evtbl"></table></div>
    </div>

    <div class="card">
      <h2><span class="modtag">⑤</span>输出<button class="nref" data-note="out-cols" title="逐帧结果表各列含义">?</button></h2>
      <div class="row">
        <button class="primary" id="run">▶ 模拟</button>
        <button id="selftest">一键自检</button><button class="nref" data-note="cases" title="内置标定用例">?</button><button class="nref" data-note="cli" title="计算核心与自检">?</button>
        <button id="csv">导出 CSV</button>
        <span id="summary" class="hint"></span>
      </div>
      <div id="trackBox"><svg id="track" class="svgfit" viewBox="0 0 546 378" width="546" height="378" style="border:1px solid var(--bd);border-radius:8px;background:var(--bg)"></svg></div>
      <div style="margin-top:6px;overflow:auto"><table id="frtbl"></table></div>
      <div id="selfbox"></div>
    </div>

    <div class="card">
      <h2>实测对照（粘贴 帧,x,y 每行一条）</h2>
      <div class="row"><label>实测第 1 帧 ↔ 模拟帧</label><input type="number" id="cmpoff" value="1" style="width:58px">
        <span class="hint" id="cmpoffHint"></span></div>
      <textarea id="obs" placeholder="1,5.446403,4&#10;2,5.563425,4"></textarea>
      <div class="row"><button id="cmp">比对</button><span id="cmpout" class="hint"></span></div>
      <div style="overflow:auto"><table id="cmptbl"></table></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2><span class="modtag">②</span>敌人参数</h2>
      <div class="row"><label>起点 x</label><input type="number" id="sx" step="0.5" value="5"></div>
      <div class="row"><label>起点 y</label><input type="number" id="sy" step="0.5" value="3"></div>
      <div class="row"><label>重量等级</label><input type="number" id="ml" min="0" max="6" value="3">
        <button class="nref" data-note="mass-idx" title="重量等级与力 idx">?</button></div>
      <div class="row"><label>碰撞检测</label>
        <select id="cdmode"><option value="1">Continuous（连续）</option><option value="0">Discrete（离散）</option></select></div>
      <div class="row"><label>线性摩擦</label><input type="number" id="ff" step="0.1" value="1">
        <span style="font-size:11px;color:var(--tx2)">× 0.1635 /帧</span><button class="nref" data-note="friction" title="线性摩擦（0.1635 / 帧）">?</button></div>
    </div>

    <div class="card">
      <h2><span class="modtag">④</span>高级参数</h2>
      <div class="row"><label>接触摩擦 μ</label><input type="number" id="mu" step="0.05" min="0" value="0.4"><button class="nref" data-note="mu" title="接触切向摩擦 μ">?</button></div>
      <details style="margin-top:8px">
        <summary>更多（⚠ 未定案项）</summary>
        <div class="row"><label>每帧步数</label><input type="number" id="spf" min="1" max="3" value="1">
          <button class="nref" data-note="more" title="更多（未定案项）">?</button></div>
        <div class="row"><label>刀锋 cd=0</label><select id="blade"><option value="auto">自动（相交⇒常规 / 相切⇒TOI）</option><option value="1">强制按 TOI</option><option value="0">强制按常规 REG</option></select></div>
        <div class="row"><label>最大帧数</label><input type="number" id="maxf" value="60"></div>
      </details>
      <div id="derive" class="okbox" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>判据速查<button class="nref" data-note="criteria" title="判据速查">?</button></h2>
    </div>
  </div>
</div>
</div>

<div id="scrim"></div>
<div id="popover" role="dialog" aria-labelledby="popTitle">
  <div class="ph"><b id="popTitle">说明</b><span class="sp"></span>
    <button id="popClose" aria-label="关闭">✕</button></div>
  <div class="pb" id="popBody"></div>
</div>


<script src="unbalance-notes.js"></script>

<script id="sim-core">
var SIM = (function () {
'use strict';

var K = {
  dt: 1/30,
  slop: 0.005,
  TR: 0.11,
  bg: 0.2,
  toiBg: 0.75,
  posIters: 3,
  toiIters: 20,
  maxSubSteps: 8,
  velIters: 8,
  toiWin: 0.09625,
  toiTarget: 0.095,
  toiTol: 0.00125,
  maxCorr: 0.2,
  maxTrans: 100,
  maxTransSq: 10000,
  minSpd: 0.1,
  protectFrames: 4,
  mass: 1,
  grav: 9.81,
  fricFactor: 0.5,
  pushForces: [0,100,200,400,450,530,580],
  pullForces: [0,2,10,40,42,44,46],
  zeroIndex: 3,
  capR: 0.1,
  capH: 0.2,
  mu: 0.4,
  exitTolReg: 0.01,
  exitTolTOI: 0.0025,
  tooCloseSqr: 0.0625,
  stopRadius: 0.05,
  blockRadius: 0.6708,
};
K.decel = K.grav * K.mass * K.fricFactor * K.dt;
var DIR4 = [{x:0,y:1},{x:1,y:0},{x:0,y:-1},{x:-1,y:0}];
function quant4(x, y){
  var bi = 0, bd = -2;
  for (var i = 0; i < 4; i++){
    var d = x * DIR4[i].x + y * DIR4[i].y;
    if (d > bd){ bd = d; bi = i; }
  }
  return bi;
}

function roundHalfUp(v){ return Math.floor(v + 0.5); }

function boxOf(c){ return {x0:c[0]-0.5, x1:c[0]+0.5, y0:c[1]-0.5, y1:c[1]+0.5}; }

function circleVsBox(c, b) {
  var px = Math.max(b.x0, Math.min(c.x, b.x1));
  var py = Math.max(b.y0, Math.min(c.y, b.y1));
  var cx = (b.x0 + b.x1)/2, cy = (b.y0 + b.y1)/2;
  var dx = c.x - px, dy = c.y - py;
  if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) {
    var dL = c.x - b.x0, dR = b.x1 - c.x, dB = c.y - b.y0, dT = b.y1 - c.y;
    var depths = [dL, dR, dB, dT];
    var m = Math.min(dL, dR, dB, dT);
    var hits = depths.filter(function(z){ return Math.abs(z - m) < 1e-12; });
    if (hits.length > 1) { return {n:{x:1, y:0}, sepCore:-m,
      planePoint:{x:cx + 0.5, y:cy}, region:'inside', tie:true}; }
    var n; if (dL === m) n = {x:-1,y:0}; else if (dR === m) n = {x:1,y:0};
    else if (dB === m) n = {x:0,y:-1}; else n = {x:0,y:1};
    return {n:n, sepCore:-m, planePoint:{x:cx + 0.5*n.x, y:cy + 0.5*n.y},
            region:'inside', tie:false};
  }
  var L = Math.hypot(dx, dy) || 1e-12;
  var n = {x: dx/L, y: dy/L};
  var atX = (px === b.x0 || px === b.x1), atY = (py === b.y0 || py === b.y1);
  var v = (atX && atY) ? {x:px, y:py} : null;
  return {n:n, sepCore:L, planePoint:{x:px, y:py}, region: v ? 'vertex' : 'face', v:v, tie:false};
}

function manifoldAt(px, py, wall) {
  var b = boxOf(wall);
  var caps = [{x:px, y:py}, {x:px, y:py - K.capH}];
  var f0 = circleVsBox(caps[0], b), f1 = circleVsBox(caps[1], b);
  var f1Wins = (f1.sepCore < f0.sepCore);
  var best = f1Wins ? f1 : f0;
  var only = (best.region === 'vertex') ? (f1Wins ? 0 : 1) : -1;
  var i, tie = false;
  if (f0.region === 'inside' && f1.region === 'inside') {
    only = -1;
    var cx = (b.x0 + b.x1)/2, cy = (b.y0 + b.y1)/2;
    var cand = [
      {nx: 1, ny: 0, s: Math.min(caps[0].x, caps[1].x) - b.x1},
      {nx:-1, ny: 0, s: b.x0 - Math.max(caps[0].x, caps[1].x)},
      {nx: 0, ny: 1, s: Math.min(caps[0].y, caps[1].y) - b.y1},
      {nx: 0, ny:-1, s: b.y0 - Math.max(caps[0].y, caps[1].y)}
    ];
    var bi = 0;
    for (i = 1; i < 4; i++) if (cand[i].s > cand[bi].s) bi = i;
    for (i = 0; i < 4; i++) if (i !== bi && Math.abs(cand[i].s - cand[bi].s) < 1e-12) tie = true;
    best = {n:{x:cand[bi].nx, y:cand[bi].ny}, sepCore:cand[bi].s, tie:tie,
            planePoint:{x:cx + 0.5*cand[bi].nx, y:cy + 0.5*cand[bi].ny}, region:'inside', v:null};
  }
  var n = best.n, cd = best.sepCore, pp = best.planePoint;

  var pts = [{x:px, y:py-K.capH}, {x:px, y:py}];
  var seps = [], P = 0;
  for (i = 0; i < pts.length; i++){
    var coreSep = (pts[i].x - pp.x)*n.x + (pts[i].y - pp.y)*n.y;
    seps.push(coreSep - K.TR);
    if (coreSep <= K.TR) P++;
  }
  if (best.region === 'vertex') { P = (P > 0) ? 1 : 0; if (P > 0) seps = [cd - K.TR]; }
  var sep = cd - K.TR;
  var yOverlap = Math.min(py, b.y1) - Math.max(py - K.capH, b.y0);
  var xInside = (px >= b.x0 - 1e-12 && px <= b.x1 + 1e-12);
  var coreInt = xInside && yOverlap > 1e-9;
  return {wall: wall, n: n, cd: cd, sep: sep, P: P, seps: seps, tie: tie,
          planePoint: pp, only: only,
          coreInt: coreInt, touch: (sep <= 0), region: best.region, vertex: best.v};
}

function manifoldsAt(px, py, walls) {
  var out = [];
  for (var i=0;i<walls.length;i++){
    var m = manifoldAt(px, py, walls[i]);
    if (m.touch || m.cd < K.toiWin) out.push(m);
  }
  return out;
}

function minCdAt(px, py, walls) {
  var best = Infinity;
  for (var i=0;i<walls.length;i++){

function toiAlphaOf(x0, y0, x1, y1, wall) {

    if (m0.coreInt) return { a: 1, cls: '刀锋·核心相交 ⇒ e_overlapped（不产生事件）' };

function velSolve(st, mfs, mu) {

function posCorrect(st, mfs, k, maxIter, tolD) {

  function refreshProtect(f) { protectUntil = Math.max(protectUntil, f + K.protectFrames - 1); }

  var pullAccum = { x: 0, y: 0 };
  var totalDistById = {};
  var stopMarked = {};

  for (k = 1; k <= maxF; k++) {
    var x0 = st.x, y0 = st.y;
    var note = '';
    var wasUnbalanced = isUnbalanced;

    st.fx = pullAccum.x; st.fy = pullAccum.y;

      var dec = K.grav * K.mass * K.fricFactor * (cfg.frictionFactor == null ? 1 : cfg.frictionFactor) * K.dt;
      var ns = Math.max(0, sp - dec);
      if (sp > 1e-12) { st.vx = st.vx / sp * ns; st.vy = st.vy / sp * ns; }
      var frictionAlive = (ns > K.minSpd) || (k <= protectUntil);
      var srcCount = srcAtStart;

        st.vx = 0; st.vy = 0;
        isUnbalanced = false;

          ch: 'EXIT', mu: 0, state: '非失衡', note: note,

            d: '摩擦后 |v|=' + ns.toFixed(6) + ' ≤ ' + K.minSpd + ' 且硬直窗已过（保护至 k=' + protectUntil +
               '）、在册拉动源数=' + srcCount + ' ⇒ OnExit 关箱，残差冻结' }] });
        if (!hasFuture(k)) break;
        continue;
      }
    }

    for (ei = 0; ei < events.length; ei++) {

      st.vx += ep._dir.x * ep._forceVal;
      st.vy += ep._dir.y * ep._forceVal;

    var doPhysics = isUnbalanced;

    }

    }

    }

             '；衰减系数 = ' + (ev.decay ? Math.pow(Math.min(1, dist2 / totalDistById[src.id]), 4).toFixed(4) : '1（未启用）') });
      }
    }

    for (ei = 0; ei < events.length; ei++) {
      var ed = events[ei];
      if (ed._dead || ed.kind !== 'pushDirect' || ed._hit !== k) continue;
      st.vx += ed._dir.x * ed._forceVal;

      allLog.push({ t: '· 非弹道推（协程阶段 · 物理步之后）',

    }

    var fr = { k: k, x0: x0, y0: y0, x1: st.x, y1: st.y, v: Math.hypot(st.vx, st.vy),

    fr.protectUntil = protectUntil;
    fr.netForce = { x: st.fx, y: st.fy };
    fr.stopRadiusArmed = stopArmed;
    if (stopHit) fr.stopRadius = stopHit;
    frames.push(fr);
  }

  var first = null;
  for (ei = 0; ei < events.length; ei++) if (!events[ei]._dead) { first = events[ei]; break; }

    idx: first ? first._idx : -1,
    forceVal: first ? first._forceVal : null,
    dir: first ? first._dir : null,

    frames: frames,

  };
}

    active:function(r){ return r.frames.some(function(f){ return (f.log||[]).some(function(l){ return /多源共存 ⇒ 不清速度/.test(l.d); }); }); } },
  { key:'schedSeq', name:'序列调度（三类管道各按其时机施力）',
    hint:'需要 pushProj / pushDirect / pull 至少两类事件（如 序列2）',
    active:function(r){
      var hasPush = false, hasPull = false;
      r.frames.forEach(function(f){ (f.log||[]).forEach(function(l){
        if (/非弹道推/.test(l.t)) hasPush = true;
        if (/BeginPull/.test(l.t)) hasPull = true;
      }); });
      return hasPush && hasPull;
    } },
  { key:'reenter', name:'退出后重入（后续力事件再次令敌人失衡）',
    hint:'需要「先退出、之后仍有未来力事件」的序列（如 序列6）',
    active:function(r){
      var ex = -1;
      for (var i=0;i<r.frames.length;i++) if (r.frames[i].ch === 'EXIT') { ex = i; break; }
      return ex >= 0 && r.frames.slice(ex+1).some(function(f){ return f.state === '失衡'; });
    } },
  { key:'stopRadius', name:'急停（判据 A 距拉力终点 ≤0.05 ∨ 判据 B 距效果源 ≤0.6708 ⇒ 清零速度一次、不 EndPull ⇒ 失衡持续到拉力结束）',
    hint:'需要敌人进入拉力终点 0.05 内（A）或距效果源/施力者中心 0.6708 内（B）（如 测试10 / 测试11 / 序列7）',
    active:function(r){ return r.frames.some(function(f){ return f.stopRadius && f.stopRadius.hit; }); } },
  { key:'splashRadial', name:'溅射降级（太近/太歪 ⇒ 力度−2 且方向强制改径向）',
    hint:'需要 push 事件 + splash 开 + 「太近」(≤0.25 格) 或「方向 4 方向量化不符」(如 序列8 / 序列9)',
    active:function(r){ return (r.events||[]).some(function(e){ return e._splashHit; }); } },
  { key:'multiPush', name:'同帧多推合力（冲量矢量相加进速度，不是后者覆盖）',
    hint:'需要两个以上推事件落在同一命中帧（如 序列10）',
    active:function(r){
      var n = {};
      (r.events||[]).forEach(function(e){
        if (e._dead || e.kind === 'pull') return;
        n[e._hit] = (n[e._hit] || 0) + 1;
      });
      return Object.keys(n).some(function(kk){ return n[kk] > 1; });
    } },
  { key:'sweptPassThrough', name:'扫掠 AABB 成对 + 见证轴求根（一帧自由位移 > 墙格宽时 TOI 仍拦得住）',
    hint:'需要"单帧自由位移 > 1 格"的用例（同帧多份推 + 轻重量 ⇒ 如 扫掠穿越）',
    active:function(r){ return (r.frames||[]).some(function(f){ return (f.sweptOnly||0) > 0; }); } },
  { key:'cdDiscrete', name:'离散型（collisionDetection=Discrete）完全没有 CCD ⇒ 够快就穿墙',
    hint:'需要 continuous=false + 单帧自由位移 > 墙格宽（如 离散型对照）',
    active:function(r){ return (r.frames||[]).some(function(f){
      return Math.abs(f.x1 - f.x0) > 1.0 && f.ch.indexOf('TOI') < 0; }); } },
];

function runCases() {
  var res = CASES.map(function(c){
    var r = simulate(c.cfg);
    if (r.err) return {name:c.name, pass:false, err:r.err, rows:[]};
    if (c.check) { var res = c.check(r); return {name:c.name, pass:res.pass, info:res.info, rows:[]}; }
    var vals = r.frames.map(function(f){ return c.axis === 'x' ? f.x1 : f.y1; });
    var rows = [], pass = true;
    var off = (c.cfg.mode === 'pull') ? c.cfg.pullStart : 0;
    for (var i=0;i<c.expect.length;i++){
      var got = vals[i+off];
      var e = c.expect[i];
      var d = (got == null) ? NaN : Math.abs(got - e);
      if (!(d <= 1e-4)) pass = false;
      rows.push({i:i+1, exp:e, got:got, d:d});
    }
    return {name:c.name, pass:pass, rows:rows, vals:vals};
  });
  var pw = pairWindowCheck();
  res.push({
    name:'宽相成对口径（扫掠 AABB：步首 fat 窗口外、扫掠路径上仍成对）',
    pass: pw.ok, rows: [],
    info:'单点位姿成对数 = ' + pw.one + '（期望 0）；扫掠后成对数 = ' + pw.swp + '（期望 1）；' +
         '整段都够不到 = ' + pw.far + '（期望 0）'
  });
  var cov = MECH.map(function(m){
    var hit = CASES.filter(function(c, i){
      var r = simulate(c.cfg);
      if (r.err) return false;
      return m.active(r);
    }).map(function(c){ return c.name.replace(/^([^·]+·)\s*/, '').slice(0, 18); });
    return {mech:m, cases:hit};
  });
  var miss = cov.filter(function(x){ return x.cases.length === 0; });
  res.push({
    name:'机制覆盖度自检（' + (MECH.length - miss.length) + '/' + MECH.length + ' 条机制有用例激活）',
    pass: miss.length === 0, rows: [],
    info: cov.map(function(x){
      return (x.cases.length ? '✅ ' : '❌ ') + x.mech.name +
        (x.cases.length ? ' ← ' + x.cases.join('、') : '：<b>无用例覆盖</b> ⇒ ' + x.mech.hint);
    }).join('<br>')
  });
  return res;
}

return {K:K, simulate:simulate, CASES:CASES, runCases:runCases, manifoldAt:manifoldAt, roundHalfUp:roundHalfUp,
        pairsAt:pairsAt, pairWindowCheck:pairWindowCheck};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = SIM;
</script>

<script>
var W = 13, H = 9, CELL = 42;
var walls = [];
var events = [];
var putMode = 'enemy';
var selEv = 0;
var $ = function(id){ return document.getElementById(id); };

var NOTES = (typeof window !== "undefined" && window.UNBALANCE_NOTES && window.UNBALANCE_NOTES.notes) || [];
function noteById(id){ for (var i=0;i<NOTES.length;i++) if (NOTES[i].id===id) return NOTES[i]; return null; }
function escTxt(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var popEl = document.getElementById("popover"),
    scrimEl = document.getElementById("scrim"),
    popTitle = document.getElementById("popTitle"),
    popBody = document.getElementById("popBody");
function closePop(){ popEl.classList.remove("open"); scrimEl.classList.remove("open"); }
function placeAt(anchor){
  var vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  var pw = Math.min(360, vw - 16);
  var r = (anchor && anchor.getBoundingClientRect) ? anchor.getBoundingClientRect() : {left:0,right:0,top:0,bottom:0};
  var h = popEl.offsetHeight || 240;
  var left = r.right + 8;
  if (left + pw > vw - 8) left = r.left - pw - 8;
  if (left < 8) left = 8;
  if (left + pw > vw - 8) left = vw - pw - 8;
  var top = r.bottom + 8;
  if (top + h > vh - 8) top = r.top - h - 8;
  if (top < 8) top = 8;
  popEl.style.width = pw + "px";
  popEl.style.left = left + "px";
  popEl.style.top = top + "px";
  popEl.style.maxHeight = Math.min(vh - 16, 420) + "px";
  scrimEl.classList.remove("open");
}
function centerPop(){
  var vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
  var pw = Math.min(720, vw - 32);
  var h = Math.min(popEl.offsetHeight || 480, Math.floor(vh * 0.82));
  popEl.style.width = pw + "px";
  popEl.style.maxHeight = Math.floor(vh * 0.82) + "px";
  popEl.style.left = Math.max(16, (vw - pw) / 2) + "px";
  popEl.style.top = Math.max(16, (vh - h) / 2) + "px";
  scrimEl.classList.add("open");
}
function showPop(title, html, anchor){
  popTitle.textContent = title;
  popBody.innerHTML = html;
  popEl.classList.add("open");
  if (anchor) placeAt(anchor); else centerPop();
}
function openNote(id, anchor){
  var n = noteById(id);
  showPop(n ? n.title : "说明",
    n ? '<div class="bd">' + n.body + '</div>'
      : '<div class="bd">缺 id=<code>' + escTxt(id) + '</code>：检查同目录的 unbalance-notes.js 是否加载。</div>',
    anchor);
}
function openAllNotes(){
  var html = NOTES.map(function(n){
    return '<h4 id="note-' + escTxt(n.id) + '">' + escTxt(n.title) + '</h4><div class="bd">' + n.body + '</div>';
  }).join('') || '<div class="bd">没加载到任何说明：检查同目录的 unbalance-notes.js。</div>';
  showPop("全部说明（" + NOTES.length + " 条）", html, null);
}
document.addEventListener("click", function(ev){
  var el = ev.target;
  while (el) {
    var v = (el.getAttribute && el.getAttribute("data-note")) || (el.dataset && el.dataset.note);
    if (v) { openNote(v, el); return; }
    var id = el.id || "";
    if (id === "allNotesBtn") { openAllNotes(); return; }
    if (id === "popClose" || id === "scrim") { closePop(); return; }
    if (id === "popover") return;
    el = el.parentNode || el.parentElement;
  }
  closePop();
});
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closePop(); });
if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
  window.addEventListener("hashchange", function(){
    var h = String(location.hash || "");
    if (h.indexOf("#note-") === 0) openNote(h.slice(6));
  });
}

var KIND_LABEL = { pushProj:'弹道推力', pushDirect:'非弹道推力', pull:'拉力' };

function hasWall(x,y){ return walls.some(function(w){ return w[0]===x&&w[1]===y; }); }
function toggleWall(x,y){
  for (var i=0;i<walls.length;i++) if (walls[i][0]===x&&walls[i][1]===y){ walls.splice(i,1); draw(); return; }
  walls.push([x,y]); draw();
}
function sx(wx){ return (wx+0.5)*CELL; }
function sy(wy){ return (H-0.5-wy)*CELL; }
function num(id, d){ var v = parseFloat($(id).value); return isFinite(v) ? v : d; }
function intv(id, d){ var v = parseInt($(id).value); return isFinite(v) ? v : d; }
function intv0(v){ var n = parseInt(v); return isFinite(n) ? n : 0; }
function enemyPos(){ return {x: num('sx', 5), y: num('sy', 3)}; }

function newEvent(kind){
  var p = enemyPos();
  var src = (kind === 'pull') ? {x:p.x, y:p.y + 2.5} : {x:p.x, y:p.y - 1};
  return {
    kind: kind,
    hitFrame: 1,
    forceLevel: 1,
    effSrc:   {x: src.x, y: src.y},
    forceSrc: {x: src.x, y: src.y},
    dirMode: (kind === 'pull') ? 'link' : 'preset',
    ang: 180,
    duration: (kind === 'pull') ? 30 : 0,
    decay: true,
    expireStop: false,
    splash: false
  };
}
function dirOf(e, ex, ey){
  if (e.dirMode === 'link'){
    var fx = e.forceSrc.x, fy = e.forceSrc.y;
    if (isFinite(fx) && isFinite(fy)){
      var dx = ex - fx, dy = ey - fy, L = Math.hypot(dx, dy) || 1e-12;
      return (e.kind === 'pull') ? {x: -dx/L, y: -dy/L} : {x: dx/L, y: dy/L};
    }
  }
  var a = (parseFloat(e.ang) || 0) * Math.PI / 180;
  return {x: Math.cos(a), y: Math.sin(a)};
}
function degOf(d){ return Math.round(((Math.atan2(d.y, d.x) * 180 / Math.PI) % 360 + 360) % 360); }
function normAng(a){ return ((parseFloat(a) || 0) % 360 + 360) % 360; }
var DIR8 = [[90,'↑ 上'],[270,'↓ 下'],[180,'← 左'],[0,'→ 右'],
            [135,'↖ 左上'],[45,'↗ 右上'],[225,'↙ 左下'],[315,'↘ 右下']];
function arrowOf(deg){
  var a = ((deg % 360) + 360) % 360;
  var tbl = [[0,'→'],[45,'↗'],[90,'↑'],[135,'↖'],[180,'←'],[225,'↙'],[270,'↓'],[315,'↘']];
  var best = tbl[0], bd = 999;
  for (var i=0;i<tbl.length;i++){
    var d = Math.abs(((a - tbl[i][0]) % 360 + 540) % 360 - 180);
    if (d < bd){ bd = d; best = tbl[i]; }
  }
  return best[1];
}
function firstDispFrame(e){
  if (e.kind === 'pull') return (e.hitFrame|0) + 2;
  if (e.kind === 'pushDirect') return (e.hitFrame|0) + 1;
  return (e.hitFrame|0);
}

function draw(){
  var s = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">'+
          '<path d="M2 1L8 5L2 9" fill="none" stroke="#d85a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  s += '<rect x="0" y="0" width="'+W*CELL+'" height="'+H*CELL+'" fill="#ffffff"/>';
  for (var x=0;x<W;x++) for (var y=0;y<H;y++){
    var wall = hasWall(x,y);
    s += '<rect class="cell" data-x="'+x+'" data-y="'+y+'" x="'+(x*CELL)+'" y="'+((H-1-y)*CELL)+
         '" width="'+CELL+'" height="'+CELL+'" fill="'+(wall?'#d3d1c7':'#ffffff')+
         '" stroke="#e2e0da" stroke-width="1"/>';
  }
  for (var i=1;i<W;i++) s += '<line x1="'+(i*CELL)+'" y1="0" x2="'+(i*CELL)+'" y2="'+(H*CELL)+'" stroke="#f0eee9"/>';
  for (var j=1;j<H;j++) s += '<line x1="0" y1="'+(j*CELL)+'" x2="'+(W*CELL)+'" y2="'+(j*CELL)+'" stroke="#f0eee9"/>';
  walls.forEach(function(w){
    s += '<text x="'+sx(w[0])+'" y="'+(sy(w[1])+4)+'" text-anchor="middle" font-size="11" fill="#5f5e5a">'+w[0]+','+w[1]+'</text>';
  });
  var ep = enemyPos();
  var ex = ep.x, ey = ep.y, hasE = isFinite(ex) && isFinite(ey);
  events.forEach(function(e, i){
    var sel = (i === selEv);
    var isPull = e.kind === 'pull';
    if (e.effSrc && isFinite(e.effSrc.x) && isFinite(e.effSrc.y) && (isPull || sel)){
      var qx = sx(e.effSrc.x), qy = sy(e.effSrc.y), r = sel ? 8 : 6;
      s += '<polygon points="'+qx+','+(qy-r)+' '+(qx+r)+','+qy+' '+qx+','+(qy+r)+' '+(qx-r)+','+qy+
           '" fill="#f5c4b3" stroke="#993c1d" stroke-width="'+(sel?2:1)+'"/>';
    }
    if (e.forceSrc && isFinite(e.forceSrc.x) && isFinite(e.forceSrc.y) && (isPull || sel)){
      var px = sx(e.forceSrc.x), py = sy(e.forceSrc.y), r2 = sel ? 8 : 6;
      s += '<rect x="'+(px-r2)+'" y="'+(py-r2)+'" width="'+(2*r2)+'" height="'+(2*r2)+
           '" fill="#b5d4f4" stroke="#0c447c" stroke-width="'+(sel?2:1)+'"/>';
    }
    if (hasE){
      var d = dirOf(e, ex, ey);
      var L = sel ? 52 : 40;
      var x1 = sx(ex), y1 = sy(ey);
      var x2 = x1 + d.x*L, y2 = y1 - d.y*L;
      s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+((isPull)?'#d4537e':'#185fa5')+
           '" stroke-width="'+(sel?2.5:1.5)+'" opacity="'+(sel?1:0.55)+'" marker-end="url(#ah)"/>';
      s += '<text x="'+(x2+6)+'" y="'+(y2+4)+'" font-size="10" fill="'+((isPull)?'#993556':'#185fa5')+
           '" opacity="'+(sel?1:0.7)+'">#'+(i+1)+'</text>';
    }
  });
  if (hasE){
    s += '<circle cx="'+sx(ex)+'" cy="'+sy(ey)+'" r="7" fill="#d3d1c7" stroke="#2c2c2a"/>';
    s += '<text x="'+sx(ex)+'" y="'+(sy(ey)-11)+'" text-anchor="middle" font-size="11" fill="#2c2c2a">敌 '+ex+','+ey+'</text>';
  }
  $('map').innerHTML = s;
  Array.prototype.forEach.call($('map').querySelectorAll('.cell'), function(el){
    el.addEventListener('click', function(){ toggleWall(parseInt(el.dataset.x), parseInt(el.dataset.y)); });
  });
}

function drawTrack(frames){
  var s = '<rect x="0" y="0" width="'+W*CELL+'" height="'+H*CELL+'" fill="#ffffff"/>';
  for (var x=0;x<W;x++) for (var y=0;y<H;y++){
    if (hasWall(x,y)) s += '<rect x="'+(x*CELL)+'" y="'+((H-1-y)*CELL)+'" width="'+CELL+'" height="'+CELL+'" fill="#d3d1c7" stroke="#e2e0da"/>';
  }
  var pts = frames.map(function(f){ return [sx(f.x1), sy(f.y1)]; });
  pts.unshift([sx(frames[0]?frames[0].x0:0), sy(frames[0]?frames[0].y0:0)]);
  for (var i=1;i<pts.length;i++)
    s += '<line x1="'+pts[i-1][0]+'" y1="'+pts[i-1][1]+'" x2="'+pts[i][0]+'" y2="'+pts[i][1]+'" stroke="#185fa5" stroke-width="1.5"/>';
  pts.forEach(function(p,i){
    s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===0?4:3)+'" fill="'+(i===0?'#b5d4f4':'#378add')+'"/>';
  });
  var last = pts[pts.length-1];
  s += '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="7" fill="none" stroke="#d85a30" stroke-width="2"/>';
  $('track').innerHTML = s;
}

function optHtml(list, cur){
  return list.map(function(o){
    return '<option value="'+o[0]+'"'+(String(o[0])===String(cur)?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
}
function renderEvents(){
  var h = '<tr><th class="l">#</th><th class="l">类型</th><th>命中帧</th><th>力度</th>'+
          '<th class="l">效果源 <span class="hint" style="font-weight:400">(干员位)</span></th>'+
          '<th class="l">力起点 <span class="hint" style="font-weight:400">(力源)</span></th>'+
          '<th class="l">方向模式</th><th class="l">方向</th>'+
          '<th>时长(帧)</th><th class="l">衰减 / 溅射</th><th class="l">到点</th><th></th></tr>';
  var ep = enemyPos();
  events.forEach(function(e, i){
    var isPull = e.kind === 'pull';
    var d = dirOf(e, ep.x, ep.y), deg = degOf(d);
    h += '<tr data-i="'+i+'"'+(i===selEv?' class="sel"':'')+'>'+
      '<td class="l mono">'+(i+1)+'</td>'+
      '<td class="l"><select data-f="kind">'+
        optHtml([['pushProj','弹道推力'],['pushDirect','非弹道推力'],['pull','拉力']], e.kind)+'</select></td>'+
      '<td><input type="number" data-f="hitFrame" min="0" value="'+e.hitFrame+'" style="width:50px"></td>'+
      '<td><input type="number" data-f="forceLevel" min="0" max="6" value="'+e.forceLevel+'" style="width:46px"></td>'+
      '<td class="l">x<input type="number" data-f="effx" step="0.5" value="'+e.effSrc.x+'" style="width:54px">'+
        ' y<input type="number" data-f="effy" step="0.5" value="'+e.effSrc.y+'" style="width:54px"></td>'+
      '<td class="l">x<input type="number" data-f="fsx" step="0.5" value="'+e.forceSrc.x+'" style="width:54px">'+
        ' y<input type="number" data-f="fsy" step="0.5" value="'+e.forceSrc.y+'" style="width:54px"></td>'+
      '<td class="l"><select data-f="dirMode">'+
        optHtml([['preset','预设角度'],['link','由力源计算']], e.dirMode)+'</select></td>'+
      '<td class="l">' + (e.dirMode === 'link'
        ? '<span class="mono" title="由力源与敌人位置实时算出">'+arrowOf(deg)+' '+deg+'°</span>'
        : '<select data-f="ang" title="预设方向（9 选一）；其余角度请用「由力源计算」">'+
            DIR8.map(function(o){
              return '<option value="'+o[0]+'"'+(Math.abs(normAng(e.ang) - o[0]) < 1e-9 ? ' selected' : '')+'>'+o[1]+'</option>';
            }).join('') + '</select>') + '</td>'+
      '<td>' + (isPull
        ? '<input type="number" data-f="duration" min="0" value="'+e.duration+'" style="width:54px">'
        : '<span class="hint">—</span>') + '</td>'+
      '<td class="l">' + (isPull
        ? '<select data-f="decay">'+optHtml([['1','开'],['0','关']], e.decay?'1':'0')+'</select>'
        : '<select data-f="splash" title="溅射降级（仅推力）">'+optHtml([['0','关'],['1','开']], e.splash?'1':'0')+'</select>') + '</td>'+
      '<td class="l">' + (isPull
        ? '<select data-f="expireStop">'+optHtml([['1','清速+End'],['0','仅停力']], e.expireStop?'1':'0')+'</select>'
        : '<span class="hint">—</span>') + '</td>'+
      '<td><button data-act="del" title="删除该事件">×</button></td>'+
    '</tr>';
  });
  if (!events.length)
    h += '<tr><td class="l hint" colspan="12">还没有事件 —— 点上面的按钮添加（可加多个，各自按类型择帧生效）</td></tr>';
  $('evtbl').innerHTML = h;
  $('evHint').innerHTML = events.length
    ? '共 <b>'+events.length+'</b> 个事件；点行可选中（选中行 = 地图上放「源」的目标）'
    : '';
  refreshDerived();
}

function readCfg(){
  var ml = intv('ml', 3);
  var ep = enemyPos();
  var forces = events.map(function(e, i){
    var o = { kind: e.kind, hitFrame: intv0(e.hitFrame), forceLevel: intv0(e.forceLevel),
              massLevel: ml, sourceId: i, splash: !!e.splash,
              src: {x: e.forceSrc.x, y: e.forceSrc.y},
              effSrc: {x: e.effSrc.x, y: e.effSrc.y} };
    if (e.kind === 'pull'){
      o.duration = Math.max(0, intv0(e.duration));
      o.decay = !!e.decay;
      o.expireStop = !!e.expireStop;
      o.totalDistance = null;
      if (e.dirMode === 'preset'){ o.dirMode = 'preset'; o.dir = dirOf(e, ep.x, ep.y); }
    } else {
      o.dir = dirOf(e, ep.x, ep.y);
      o.awayDir = o.dir;
      if (e.dirMode === 'preset') o.dirMode = 'preset';
    }
    return o;
  });
  return {
    walls: walls.slice(),
    start: {x: ep.x, y: ep.y},
    forces: forces,
    mu: num('mu', 0.4),
    frictionFactor: num('ff', 1),
    stepsPerFrame: intv('spf', 1),
    maxFrames: intv('maxf', 60),
    continuous: $('cdmode').value === '1',
    bladeToi: ($('blade').value === 'auto') ? undefined : ($('blade').value === '1'),
    stunned: true
  };
}

    var idx = SIM.K.zeroIndex + (f.forceLevel - f.massLevel);
    var tbl = f.kind === 'pull' ? SIM.K.pullForces : SIM.K.pushForces;
    var v = (idx >= 0 && idx < tbl.length) ? tbl[idx] : 0;
    var line = '#' + (f.sourceId + 1) + ' <b>' + KIND_LABEL[f.kind] + '</b>（命中帧 ' + f.hitFrame + '）⇒ idx=' + idx +

    if (idx < 0 || idx >= tbl.length) line += ' <span class="r">⚠ idx 越界 ⇒ 该事件失效</span>';
    else if (v === 0) line += ' <span class="r">⚠ 力度 = 0（等级差 < −2）⇒ 该事件失效</span>';
    else line += (f.kind === 'pull' ? ' ⇒ F = ' + v + ' N，Δv/帧 = ' + (v/30).toFixed(4)
                                    : ' ⇒ Δv = ' + (v*0.01).toFixed(2) + ' m/s');

      }
    } else {
      dirTxt = '方向 = <b>' + degOf(f.dir) + '°</b>' + (f.dirMode === 'preset' ? '（预设角）' : '（由力源推离）');

      '；效果源 (' + f.effSrc.x + ',' + f.effSrc.y + ') · 力源 (' + f.src.x + ',' + f.src.y + ')' +

             : '时长不限（实机恒有 _pullDuration / EnsureLifeTime，此档仅作对照）') + '</span>';
    } else if (f.kind === 'pushDirect'){
      line += '<br><span class="hint">k=' + f.hitFrame + ' 末施冲量 ⇒ k=' + (f.hitFrame+1) + ' 位移（该帧先经一次线性摩擦）；不登记拉源</span>';
    } else {
      line += '<br><span class="hint">k=' + f.hitFrame + ' 命中即施冲量 ⇒ <b>同帧</b>位移；不登记拉源</span>';

      '① 目标距效果源 ≤ <b>0.25 格</b>（<span class="mono">TOO_CLOSE_TOLERANCE_SQR = 0.0625</span>）；或<br>' +
      '② <b>方向不符</b>：<span class="mono">ParseDirection(目标 − 源) ≠ 源朝向</span>，即 <b>4 方向量化后不相等</b>' +

function renderSteps(l){
  var h = '<div><b>' + l.t + '</b> — ' + l.d + '</div>';
  if (l.trace && l.trace.length){
    var SHOW = 8, head = l.trace.slice(0, SHOW), tail = l.trace.slice(SHOW);
    var body = traceRows(head);
    if (tail.length){
      body += '<details class="tdtl"><summary>…再 ' + tail.length + ' 轮（共 ' + l.trace.length + ' 轮）</summary>' +
              '<div class="tsub">' + traceRows(tail) + '</div></details>';
    }
    h += '<div class="tsub">' + body + '</div>';
  }
  return h;
}
function traceRows(tr){
  var h = '';
  tr.forEach(function(rd){
    var rows = (rd.steps && rd.steps.length)
      ? rd.steps.map(function(s){
          var dir = (s.nx!==0 ? (s.nx>0?'+x':'−x') : (s.ny>0?'+y':'−y'));
          return '<div class="trow"><span class="wtag">墙('+s.wall+')</span> ' +
            '<span class="tdir">'+dir+'</span> 点'+s.point+
            ' d='+s.d.toFixed(5)+' corr='+s.corr.toFixed(5)+
            ' ⇒ ('+s.bx.toFixed(5)+', '+s.by.toFixed(5)+') → ('+s.ax.toFixed(5)+', '+s.ay.toFixed(5)+')</div>';
        }).join('')
      : '<div class="trow hint">本轮无有效接触点修正</div>';
    h += '<div class="titer">轮 '+rd.iter+'【entryD='+rd.entryD.toExponential(2)+'，累计修正='+rd.corrSum.toFixed(5)+'】'+
         (rd.corrSum<=0?'（mv=0 ⇒ break）': (rd.entryD<=0?'（entryD≤0 ⇒ break）':'')) + '</div>' + rows;
  });
  return h;
}

function run(){
  var cfg = readCfg();
  var r = SIM.simulate(cfg);
  showDerive(cfg, r);
  if (r.err){ $('frtbl').innerHTML=''; $('summary').innerHTML='<span class="r">'+r.err+'</span>'; return; }
  window.__last = {cfg:cfg, r:r};
  render(r.frames, r);
}

function selftest(){
  var res = SIM.runCases();
  var h = '<tr><th class="l">用例</th><th>判定</th><th class="l">逐帧（期望 / 预测 / 偏差）/ 断言</th></tr>';
  res.forEach(function(c){
    h += '<tr><td class="l">'+c.name+'</td><td class="'+(c.pass?'pass':'fail')+'">'+(c.pass?'通过':'不通过')+(c.err?'（'+c.err+'）':'')+'</td><td class="l mono">';
    (c.rows||[]).forEach(function(r){
      var cls = (r.d<=1e-4)?'g':(r.d<=1e-3?'y':'r');
      h += '<span class="'+cls+'">'+r.exp.toFixed(6)+' / '+(r.got==null?'—':r.got.toFixed(6))+' / '+r.d.toFixed(6)+'</span>　';
    });
    if (c.info) h += '<span class="hint">'+c.info+'</span>';
    h += '</td></tr>';
  });
  $('selfbox').innerHTML = '<div class="card"><h2>自检结果</h2><table class="selftest">'+h+'</table>'+
    '<div class="hint" style="margin-top:6px">判据：逐帧偏差 ≤ 1×10⁻⁴ 记通过。</div></div>';
}

function compare(){
  var lines = $('obs').value.trim().split('\n').map(function(s){ return s.split(',').map(Number); })
    .filter(function(a){ return a.length>=3 && a.every(function(v){ return isFinite(v); }); });
  if (!window.__last || !lines.length){ $('cmpout').textContent='先跑一次模拟，并粘贴数据'; return; }
  var fr = window.__last.r.frames;
  var off = (intv('cmpoff',1)) - 1;
  var h = '<tr><th>实测帧</th><th>实测 x</th><th>预测 x</th><th>Δx</th><th>实测 y</th><th>预测 y</th><th>Δy</th></tr>';
  var bad = 0;
  lines.forEach(function(a){
    var f = fr[a[0]-1+off];
    if (!f) return;
    var dx = Math.abs(a[1]-f.x1), dy = Math.abs(a[2]-f.y1);
    var m = Math.max(dx,dy); if (m>1e-4) bad++;
    var cls = m<=1e-4?'g':(m<=1e-3?'y':'r');
    h += '<tr><td>'+a[0]+'</td><td class="mono">'+a[1]+'</td><td class="mono">'+f.x1.toFixed(6)+'</td>'+
      '<td class="mono '+cls+'">'+dx.toExponential(2)+'</td><td class="mono">'+a[2]+'</td>'+
      '<td class="mono">'+f.y1.toFixed(6)+'</td><td class="mono '+cls+'">'+dy.toExponential(2)+'</td></tr>';
  });
  $('cmptbl').innerHTML = h;
  $('cmpout').innerHTML = lines.length + ' 行，超出 1e-4 的 ' + bad + ' 行';
}

function applyPreset(p){
  var d = FORM_DEFAULTS;
  walls = (p.walls || []).map(function(w){ return w.slice(); });
  $('sx').value = p.start.x; $('sy').value = p.start.y;
  $('ml').value = (p.ml != null) ? p.ml : d.ml;
  $('cdmode').value = p.cdmode || d.cdmode;
  $('mu').value = (p.mu != null) ? p.mu : d.mu;
  $('ff').value = (p.ff != null) ? p.ff : d.ff;
  $('spf').value = (p.spf != null) ? p.spf : d.spf;
  $('blade').value = (p.blade != null) ? String(p.blade) : d.blade;
  $('maxf').value = (p.maxf != null) ? p.maxf : d.maxf;
  events = (p.events || []).map(function(e){
    var o = newEvent(e.kind);
    for (var k in e){
      if (k === 'kind') continue;
      if (k === 'forceSrc' || k === 'effSrc') o[k] = {x: e[k].x, y: e[k].y};
      else o[k] = e[k];
    }
    if (!o.forceSrc) o.forceSrc = {x:o.effSrc.x, y:o.effSrc.y};
    if (!o.effSrc)   o.effSrc   = {x:o.forceSrc.x, y:o.forceSrc.y};
    return o;
  });
  selEv = events.length ? 0 : -1;
  renderEvents(); draw(); refreshDerived(); syncCmpOff();
}

function syncCmpOff(){

  events.forEach(function(e){ f = Math.min(f, firstDispFrame(e)); });
  if (!isFinite(f)) f = 1;
  $('cmpoff').value = f;
  $('cmpoffHint').innerHTML = '实测第 1 帧对应模拟第 <b>' + f + '</b> 帧（按最早事件的首次位移帧推算，可手改）';
}

$('map').addEventListener('click', function(e){
  if (e.target.classList.contains('cell')) return;
  var svg = $('map'), pt = svg.createSVGPoint(), wx, wy;
  pt.x = e.clientX; pt.y = e.clientY;
  var m = svg.getScreenCTM();
  if (m){
    var u = pt.matrixTransform(m.inverse());
    wx = u.x; wy = u.y;
  } else {
    var rect = svg.getBoundingClientRect();
    var k = rect.width / (W * CELL) || 1;
    wx = (e.clientX - rect.left) / k; wy = (e.clientY - rect.top) / k;
  }
  var x = Math.round((wx / CELL - 0.5)*2)/2;
  var y = Math.round((H - 0.5 - wy / CELL)*2)/2;
  if (putMode === 'effSrc' || putMode === 'forceSrc'){
    if (selEv < 0 || !events[selEv]) return;
    if (putMode === 'effSrc') events[selEv].effSrc = {x:x, y:y};
    else                      events[selEv].forceSrc = {x:x, y:y};
    renderEvents(); draw();
  } else {
    $('sx').value = x; $('sy').value = y;
    draw(); renderEvents();
  }
});
$('putEnemy').onclick = function(){ setPutMode('enemy'); };
$('putEff').onclick   = function(){ setPutMode('effSrc'); };
$('putForce').onclick = function(){ setPutMode('forceSrc'); };
$('run').onclick = run;
$('selftest').onclick = selftest;
$('csv').onclick = csv;
$('cmp').onclick = compare;
function addEv(kind){ events.push(newEvent(kind)); selEv = events.length-1; renderEvents(); draw(); syncCmpOff(); }
$('addProj').onclick   = function(){ addEv('pushProj'); };
$('addDirect').onclick = function(){ addEv('pushDirect'); };
$('addPull').onclick   = function(){ addEv('pull'); };

$('evtbl').addEventListener('click', function(ev){
  var tr = ev.target.closest ? ev.target.closest('tr') : null;
  if (!tr || tr.dataset.i == null) return;
  var i = parseInt(tr.dataset.i);
  if (ev.target.dataset.act === 'del'){
    events.splice(i, 1);
    if (selEv >= events.length) selEv = events.length - 1;
    renderEvents(); draw(); syncCmpOff();
    return;
  }
  if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT') return;
  if (selEv !== i){ selEv = i; renderEvents(); draw(); }
});
$('evtbl').addEventListener('change', function(ev){
  var tr = ev.target.closest ? ev.target.closest('tr') : null;
  if (!tr || tr.dataset.i == null) return;
  var i = parseInt(tr.dataset.i), e = events[i], f = ev.target.dataset.f;
  if (!e || !f) return;
  var v = ev.target.value, structural = false, needDraw = false;
  if (f === 'kind'){
    e.kind = v;
    if (v === 'pull' && !e.dirMode) e.dirMode = 'link';
    structural = true;
  }
  else if (f === 'hitFrame'){ e.hitFrame = Math.max(0, intv0(v)); syncCmpOff(); }
  else if (f === 'forceLevel'){ e.forceLevel = Math.max(0, intv0(v)); }
  else if (f === 'dirMode'){ e.dirMode = v; structural = true; }
  else if (f === 'ang'){ e.ang = parseFloat(v) || 0; structural = true; }
  else if (f === 'effx'){ e.effSrc.x = parseFloat(v); needDraw = true; }
  else if (f === 'effy'){ e.effSrc.y = parseFloat(v); needDraw = true; }
  else if (f === 'fsx'){ e.forceSrc.x = parseFloat(v); needDraw = true; }
  else if (f === 'fsy'){ e.forceSrc.y = parseFloat(v); needDraw = true; }
  else if (f === 'duration'){ e.duration = Math.max(0, intv0(v)); }
  else if (f === 'decay'){ e.decay = (v === '1'); }
  else if (f === 'expireStop'){ e.expireStop = (v === '1'); }
  else if (f === 'splash'){ e.splash = (v === '1'); }
  if (structural) renderEvents(); else refreshDerived();
  if (needDraw || structural) draw();
  if (!structural && (f === 'fsx' || f === 'fsy' || f === 'dirMode')) renderEvents();
});
['sx','sy'].forEach(function(id){
  $(id).addEventListener('input', function(){ draw(); renderEvents(); });
  $(id).addEventListener('change', function(){ draw(); renderEvents(); });
});
['ml','cdmode','mu','ff','spf','maxf','blade'].forEach(function(id){
  $(id).addEventListener('input', refreshDerived);
  $(id).addEventListener('change', refreshDerived);
});

renderPresets();
applyPreset(PRESETS.sA);
run();
$('selftest').textContent = '一键自检（' + SIM.CASES.length + ' 套标定）';

(function(){
  if (!NOTES.length){ console.info('未加载说明载荷 unbalance-notes.js'); return; }
  var have = {}, i;
  for (i = 0; i < NOTES.length; i++) have[NOTES[i].id] = 1;
  var refs = document.querySelectorAll('[data-note]'), miss = [], used = {};
  for (i = 0; i < refs.length; i++){
    var id = refs[i].getAttribute('data-note');
    used[id] = 1;
    if (!have[id]) miss.push(id);
  }
  if (miss.length) console.warn('正文这些 ? 在载荷里没有条目：' + miss.join(', '));
  var un = NOTES.map(function(n){ return n.id; }).filter(function(x){ return !used[x]; });
  if (un.length) console.info('这些条目只在「全部说明」里出现：' + un.join(', '));
})();
</script>
