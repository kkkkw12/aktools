<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>波次帧账分析器</title>
<script>
(function () {
  var r = document.documentElement, t, m;
  try { t = localStorage.getItem("ui-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  function apply(x) {
    r.setAttribute("data-theme", x);
    m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", x === "dark" ? "#14161a" : "#f7f7f5");
    var i = document.querySelector("[data-theme-icon]");
    if (i) i.textContent = x === "dark" ? "☾" : "☀";
  }
  apply(t);
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest && e.target.closest("[data-theme-toggle]");
    if (!b) return;
    var n = r.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(n);
    try { localStorage.setItem("ui-theme", n); } catch (e2) {}
  });
  document.addEventListener("DOMContentLoaded", function () {
    var h = document.querySelector("header");
    if (!h) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "theme-toggle";
    b.setAttribute("data-theme-toggle", "");
    b.setAttribute("aria-label", "切换深浅主题");
    b.setAttribute("title", "切换深浅主题");
    b.innerHTML = '<span data-theme-icon>' + (r.getAttribute("data-theme") === "dark" ? "☾" : "☀") + "</span>";
    h.appendChild(b);
  });
})();
</script>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --panel2:#20242c; --line:#2a2f3a;
  --tx:#d8dce2; --tx2:#8b93a1; --acc:#4da3ff; --ok:#66bb6a; --warn:#ffb74d;
  --syn:#b39ddb; --del:#5a5f6a; --gold:#ffd54f; --mimic:#ce93d8; --bad:#e26a6a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header select,input[type=text],input[type=number]{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
label.file{background:var(--acc);color:#fff;border-radius:4px;padding:4px 12px;cursor:pointer}
label.file input{display:none}
/* 换关：分区 → 关 两级。筛选框有词时跨分区找（一次列出各区的命中）。
   三个控件装在一个容器里 —— 否则窄屏上会被 flex-grow 各撑满一行。 */
#lvBar{display:flex;align-items:center;gap:8px;min-width:0}
#areaSel{max-width:190px}
#sampleSel{max-width:270px}
#lvFilter{width:150px}
#lvMsg{font-size:11px;color:var(--warn)}
#lvMsg:empty{display:none}
#totalInfo{color:var(--tx2)}
main{display:flex;align-items:flex-start}
aside{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--line);padding:10px 12px;max-height:calc(100vh - 46px);overflow-y:auto}
aside h3{font-size:12px;color:var(--tx2);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
aside h3:first-child{margin-top:0}
.grp{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.grp .gname{font-family:Consolas,monospace;color:var(--acc);font-size:12px}
.grp select{width:100%;margin-top:4px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.grp .meta{color:var(--tx2);font-size:11px;margin-top:2px}
.tag{display:inline-block;border-radius:3px;padding:0 5px;font-size:10px;margin-left:4px}
.tag.gold{background:#3a3323;color:var(--gold)}
.tag.mimic{background:#33283a;color:var(--mimic)}
.tag.hg{background:#3a2b1f;color:var(--warn)}
.tag.rg{background:#1f3040;color:var(--acc)}
.tag.pk{background:#1e3a2a;color:#8ecf9b}
.tag.var{background:#2b3040;color:#9fb3d1}
.tag.lv{background:#3a2530;color:#f0997b}
.hg{display:flex;align-items:center;gap:8px;padding:3px 4px}
.gateRow{display:flex;align-items:center;gap:5px;margin-bottom:5px;font-size:12px;flex-wrap:wrap}
.gateRow input{width:58px}
.gateRow .gname{font-family:Consolas,monospace;color:var(--acc);font-size:12px}
.gateRow .gs{color:var(--tx2);font-family:Consolas,monospace}
.mapBtns{display:flex;gap:6px;align-items:center;margin:6px 0}
.cRow{display:grid;grid-template-columns:1fr 84px;gap:6px;align-items:center;margin-bottom:4px;font-size:12px}
.cRow input{width:100%}
.eRow{display:grid;grid-template-columns:1fr 62px;gap:6px;align-items:center;margin-bottom:3px;font-size:11px}
.eRow span.k{font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eRow input{width:100%;font-size:11px;padding:2px 4px}
.src{color:var(--tx2);font-size:10px}
#mainArea{flex:1;padding:10px 14px;min-width:0}
#tlWrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
#tl{display:flex;align-items:flex-start}
#tlGutter{position:sticky;left:0;z-index:3;width:120px;min-width:120px;background:var(--panel);border-right:1px solid var(--line)}
#tlGutter .gh{height:16px}
#tlGutter .glane{box-sizing:border-box;display:flex;align-items:center;font-size:10px;color:var(--tx2);padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlGutter .glane i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;flex:none}
#tlPlot{position:relative;flex:0 0 auto}
.waveBand{position:absolute;top:0;border-left:1px solid var(--line)}
.waveBand .wl{position:absolute;top:2px;left:4px;font-size:10px;color:var(--tx2);white-space:nowrap}
.gline{position:absolute;left:0;right:0;border-top:1px dashed #1f242e}
.vline{position:absolute;top:0;width:0.5px;background:#1f242e}
.tick{position:absolute;border-left:1px solid var(--line);font-size:9px;color:var(--tx2);padding-left:2px;white-space:nowrap}
.ev{position:absolute;border-radius:2px;min-width:2px}
.ev:hover{outline:1px solid #fff}
.ev.sel{outline:2px solid #fff}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left;white-space:nowrap}
th{color:var(--tx2);background:var(--panel);font-weight:500}
tr.removed td{color:var(--del);text-decoration:line-through}
tr.removed td.reason{text-decoration:none;color:var(--tx2)}
td.mono,th.mono{font-family:Consolas,monospace}
tr.hl td{background:#243044}
tr.cat td{color:var(--acc);font-weight:600;background:var(--panel2)}
tr.tie td.tcell{color:var(--warn)}
.dt{color:var(--tx2)}
#note{color:var(--tx2);font-size:11px;margin-top:10px;line-height:1.7}
button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
.warnline{color:var(--warn);font-size:11px;margin:4px 0}
.hint{color:var(--tx2);font-size:11px}
#mdBox{display:none;margin-top:8px}
#mdOut{width:100%;height:150px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:6px;font:11px/1.4 Consolas,monospace}
/* 事件条视觉宽度仍按 px/帧 缩放（最小 2px），但用透明 ::after 把命中区撑到 ≥10px ⇒ 手机上点得中 */
.ev::after{content:"";position:absolute;left:-4px;right:-4px;top:-6px;bottom:-6px}
/* 详情条：桌面靠 title 悬浮提示，移动端不显示 title ⇒ 选中后把同一串信息落到这里 */
#evInfo{margin-bottom:8px;padding:5px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--tx2)}
#paneQ,#paneS{overflow-x:auto}
#panelBtn{display:none}
@media (max-width:860px){
  #panelBtn{display:inline-block}
  body{font-size:14px}
  main{flex-direction:column;align-items:stretch}
  aside{width:auto;min-width:0;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  aside.folded{display:none}
  #mainArea{padding:8px 10px}
  header{gap:8px;padding:8px 10px}
  header h1{font-size:14px}
  button{padding:7px 14px;font-size:14px}
  select,input[type=text],input[type=number]{font-size:14px;padding:6px 9px;min-height:34px}
  .gateRow input{width:84px}
  .cRow{grid-template-columns:1fr 110px}
  .eRow{grid-template-columns:1fr 84px}
  table{font-size:13px}
  th,td{padding:5px 9px}
  #note,.src,.hint,.warnline{font-size:12px}
  #tlGutter{width:96px;min-width:96px}
  #evInfo{font-size:13px}
  /* 区 / 关 / 筛选 三个控件锁在同一行（容器占满一行，内部按比例分） */
  #lvBar{flex:1 1 100%;gap:6px}
  #areaSel{max-width:none;flex:1 1 26%;min-width:0}
  #sampleSel{max-width:none;flex:2.2 1 40%;min-width:0}
  #lvFilter{flex:1.6 1 34%;min-width:0;width:auto}
  #lvMsg{flex:1 1 100%}
  /* 关卡总览与缩放条挤同一行，过长就截断（省一行 header 高度）。
     基准给 0 才对：给 auto 的话它会先按内容占满一行，缩放条只能换行。 */
  #totalInfo{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header{gap:6px}
}
/* 说明浮窗 */
.nref{width:15px;height:15px;padding:0;border-radius:50%;font-size:10px;line-height:13px;text-align:center;
  background:var(--panel2);color:var(--tx2);border:1px solid var(--line);cursor:pointer;vertical-align:1px;flex:none}
.nref:hover{color:var(--acc);border-color:var(--acc)}
#popover{position:fixed;display:none;z-index:20;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
#popover.open{display:flex}
#popover .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
#popover .ph b{font-size:13px;font-weight:600}
#popover .ph .sp{flex:1}
#popover .pb{overflow:auto;padding:10px 14px 18px;flex:1 1 auto}
#popover .pb h4{font-size:12.5px;margin:14px 0 4px;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:3px;scroll-margin-top:8px}
#popover .pb h4:first-child{margin-top:0}
#popover .pb .bd{color:var(--tx2);font-size:12px;line-height:1.75}
#popover .pb .bd p{margin:0 0 8px}
#popover .pb .bd b{color:var(--tx)}
#popover .pb .bd code{background:var(--panel2);border:1px solid var(--line);padding:0 4px;font-family:Consolas,monospace;font-size:11px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}
#scrim.open{display:block}
@media (max-width:860px){.nref{width:20px;height:20px;line-height:18px;font-size:12px}}
:root{color-scheme:dark;
--ut-bg:#14161a;--ut-surface:#1b1e24;--ut-surface2:#20242c;--ut-border:#2a2f3a;--ut-border2:#3b4250;
--ut-text:#dfe4ea;--ut-text2:#9aa3b1;--ut-text3:#8b93a1;
--ut-accent:#5aa9ff;--ut-on-accent:#0d1117;--ut-ok:#66bb6a;--ut-warn:#ffb74d;--ut-bad:#e57373;--ut-info:#5aa9ff;--ut-gold:#ffd54f;--ut-purple:#b39ddb;
--ut-chip:rgba(140,150,170,.16);--ut-hl:rgba(90,169,255,.14);
--ut-ok-bg:rgba(102,187,106,.14);--ut-warn-bg:rgba(255,183,77,.14);--ut-info-bg:rgba(90,169,255,.12);--ut-bad-bg:rgba(229,115,115,.14);
--ut-wob-bg:rgba(255,183,77,.10);--ut-first-bg:rgba(179,157,219,.12);
--ut-shadow:0 10px 30px rgba(0,0,0,.45);--ut-scrim:rgba(0,0,0,.42);
--ut-svg-bg:#1b1e24;--ut-svg-wall:#3b4250;--ut-svg-grid:#2a2f3a;
--ut-m-eff:#f0997b;--ut-m-eff-bg:#5a3a2e;--ut-m-force:#8ab4f8;--ut-m-force-bg:#2a3a52;
--ut-m-pull:#f48fb1;--ut-m-end:#ffb074;--ut-m-dot:#5aa9ff;
--ut-radius:10px;--ut-dur:220ms
}
:root[data-theme=light]{color-scheme:light;
--ut-bg:#f7f7f5;--ut-surface:#ffffff;--ut-surface2:#f0f0ec;--ut-border:#e2e0da;--ut-border2:#c9c6bd;
--ut-text:#2c2c2a;--ut-text2:#5f5e5a;--ut-text3:#6f6d64;
--ut-accent:#185fa5;--ut-on-accent:#ffffff;--ut-ok:#3b6d11;--ut-warn:#854f0b;--ut-bad:#a32d2d;--ut-info:#185fa5;--ut-gold:#8a6d00;--ut-purple:#6741a5;
--ut-chip:rgba(90,100,120,.10);--ut-hl:rgba(24,95,165,.10);
--ut-ok-bg:#eaf3de;--ut-warn-bg:#faeeda;--ut-info-bg:#e6f1fb;--ut-bad-bg:#fcebeb;
--ut-wob-bg:#faeeda;--ut-first-bg:#eee7f6;
--ut-shadow:0 10px 30px rgba(0,0,0,.16);--ut-scrim:rgba(0,0,0,.26);
--ut-svg-bg:#ffffff;--ut-svg-wall:#d3d1c7;--ut-svg-grid:#f0eee9;
--ut-m-eff:#993c1d;--ut-m-eff-bg:#f5c4b3;--ut-m-force:#0c447c;--ut-m-force-bg:#b5d4f4;
--ut-m-pull:#993556;--ut-m-end:#d85a30;--ut-m-dot:#378add
}
:focus-visible{outline:2px solid var(--ut-accent);outline-offset:2px}
button,a,input,select,textarea,label.file,.card,.grp,#tlWrap,.theme-toggle{transition:border-color var(--ut-dur),background var(--ut-dur),color var(--ut-dur),transform var(--ut-dur)}
button,input,select,textarea{border-radius:6px}
.card,.grp,#tlWrap,#mdOut,#popover{border-radius:var(--ut-radius)}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;align-self:center;flex:none;width:30px;height:30px;line-height:1;padding:0;border:1px solid var(--ut-border2);border-radius:8px;background:var(--ut-surface2);color:var(--ut-text2);font-size:15px;cursor:pointer}
.theme-toggle:hover{border-color:var(--ut-accent);color:var(--ut-accent);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
:root{
--bg:var(--ut-bg);--panel:var(--ut-surface);--panel2:var(--ut-surface2);--line:var(--ut-border);
--tx:var(--ut-text);--tx2:var(--ut-text2);--acc:var(--ut-accent);--ok:var(--ut-ok);--warn:var(--ut-warn);
--syn:var(--ut-purple);--del:var(--ut-text3);--gold:var(--ut-gold);--mimic:var(--ut-purple);--bad:var(--ut-bad)
}
label.file{border-radius:var(--ut-radius);color:var(--ut-on-accent)}
.tag.gold,.tag.mimic,.tag.hg,.tag.rg,.tag.pk,.tag.var,.tag.lv{background:var(--ut-chip)}
.tag.pk{color:var(--ut-ok)}.tag.var{color:var(--ut-text)}.tag.lv{color:var(--ut-bad)}
.gline{border-top-color:var(--ut-border)}.vline{background:var(--ut-border)}
.ev:hover,.ev.sel{outline-color:var(--ut-text)}
tr.hl td{background:var(--ut-hl)}
#popover{box-shadow:var(--ut-shadow)}
#scrim{background:var(--ut-scrim)}
</style>
</head>
<body>
<header>
  <button id="panelBtn">参数</button>
  <h1>波次帧账分析器</h1>
  <label class="file">导入关卡 JSON<input type="file" id="fileIn" accept=".json"></label>
  <span id="lvBar">
    <select id="areaSel" title="分区"></select>
    <select id="sampleSel" title="关卡"></select>
    <input type="text" id="lvFilter" placeholder="筛选关卡" title="输入关代码或关名（跨分区找）"
           autocomplete="off">
  </span>
  <span id="lvMsg"></span>
  <span id="totalInfo"></span>
  <button id="allNotesBtn">📖 全部说明</button>
  <span style="margin-left:auto;color:var(--tx2);font-size:12px">px/帧 <input type="range" id="zoom" min="0.05" max="2" step="0.05" value="0.35"></span>
</header>
<main>
  <aside id="panel">
    <h3>数据库（映射）<button class="nref" data-note="maps">?</button></h3>
    <div id="mapStatus"></div>
    <div class="mapBtns">
      <label class="file">导入映射<input type="file" id="mapIn" accept=".json,.js" multiple></label>
      <button id="mapClear">清除映射</button>
    </div>
    <div id="mapMsg"></div>
    <h3>随机组（randomSpawnGroupKey）<button class="nref" data-note="rand">?</button></h3>
    <div id="randGroups"></div>
    <div id="randBtns" style="margin:6px 0">
      <button id="randAll">按权重随机全部</button>
      <button id="emptyAll">全部不出</button>
    </div>
    <div class="warnline" id="randWarn"></div>

    <h3>隐藏组（hiddenGroup）<button class="nref" data-note="hidden">?</button></h3>
    <div id="hiddenGroups"></div>
    <div style="margin:6px 0"><button id="hgFromRunes">按 runes 自动勾选</button></div>

    <h3>波次门（填清场时刻）<button class="nref" data-note="gates">?</button></h3>
    <div id="gates"></div>

    <h3>计算参数<button class="nref" data-note="consts">?</button></h3>
    <div id="consts"></div>
    <div style="margin:6px 0"><button id="constReset">恢复默认</button></div>

    <h3>delayToBorn（按敌人覆盖）<button class="nref" data-note="delays">?</button></h3>
    <div id="delays"></div>

    <h3>口径<button class="nref" data-note="model">?</button><button class="nref" data-note="cli">?</button></h3>
  </aside>
  <section id="mainArea">
    <div id="tlWrap"><div id="tl"><div id="tlGutter"></div><div id="tlPlot"></div></div></div>
    <div style="display:flex;align-items:flex-start;gap:6px">
      <div id="evInfo" style="flex:1 1 auto">点时间轴上的条目看详情</div>
      <button class="nref" data-note="timeline" style="margin-top:4px">?</button>
    </div>
    <div class="tabs">
      <button id="tabQ" class="on">逐条目账</button>
      <button id="tabS">出怪时刻表</button>
    </div>

    <div id="paneQ">
      <table id="tbl"><thead><tr>
        <th>#</th><th>帧</th><th>时间</th><th title="另一个常用口径：费用条帧 = 全局帧 − 1">费用条</th>
        <th>波次.兵团.小队</th><th>类型</th><th>key / 敌人</th>
        <th class="mono">t(s)</th><th>路由</th><th>状态</th><th id="thQdt" style="display:none">Δ基准</th><th>组</th>
      </tr></thead><tbody id="tbody"></tbody></table>
    </div>

    <div id="paneS" style="display:none">
      <div style="margin-bottom:6px">
        <button id="mdBtn">导出 Markdown</button>
        <button class="nref" data-note="delta">?</button>
      </div>
      <table id="tblS"><thead><tr>
        <th>#</th><th>敌人</th><th>路线</th><th>波次.兵团.小队</th><th>帧</th><th>秒:帧</th>
        <th title="另一个常用口径：费用条帧 = 全局帧 − 1">费用条</th><th>Δ</th><th>同刻</th><th id="thSdt" style="display:none">Δ基准</th>
      </tr></thead><tbody id="tbodyS"></tbody></table>
      <div id="mdBox"><textarea id="mdOut" readonly></textarea></div>
    </div>
  </section>
</main>
<div id="scrim"></div>
<div id="popover" role="dialog" aria-labelledby="popTitle">
  <div class="ph"><b id="popTitle">说明</b><span class="sp"></span>
    <button id="popClose" aria-label="关闭">✕</button></div>
  <div class="pb" id="popBody"></div>
</div>
<script id="wave-core">
const CORE = (() => {
  const DT = 69905 / Math.pow(2, 21);
  const DEF = { exec: 1, handoff: 2, preMs: 90000, itvMs: 9000, cnt: 2 };
  const RANDOM_TYPES = new Set(["SPAWN", "ACTIVATE_PREDEFINED", "EMPTY"]);

  }
  function normalize(d, key) {
    if (d && d.waves) {
      const u = Array.isArray(d.tokens)
        ? { aliases: d.aliases || {}, local: d.localNames || {}, tokens: d.tokens, refs: d.refs || {} }
        : Object.assign(unitsOf(d), { refs: refsOf(d) });
      return { levelId: d.levelId || d.name || "(导入)", src: key || "",
               waves: d.waves, aliases: u.aliases, localNames: u.local,
               tokens: u.tokens, refs: u.refs, runes: d.runes || [] };
    }
    return d;
  }
  function hintRogueTopic(lv) {
    const pref = new Set(lv.tokens || []);
    for (const [topic, gc] of Object.entries(MAPS.trapClass)) {
      for (const v of Object.values(gc)) {
        const arr = Array.isArray(v) ? v : [v];
        for (const id of arr) if (id && pref.has(id)) return topic;
      }
    }
    return null;
  }
  function trapTagOf(lv, key) {
    if (!key) return "";
    const topic = hintRogueTopic(lv); if (!topic) return "";
    const gc = MAPS.trapClass[topic]; if (!gc) return "";
    const b = key.split("#")[0];
    if (gc.goldChestTrapId === b) return '<span class="tag gold">金箱·受 goldTrapCnt 抽取</span>';
    if ((gc.mimicEnemyIds || []).includes(b)) return '<span class="tag mimic">模仿敌·受 mimicEnemyCnt 抽取</span>';
    if ([gc.normBoxTrapId, gc.rareBoxTrapId, gc.badBoxTrapId, gc.toolBoxTrapId, gc.specialTrapId].includes(b))
      return '<span class="tag var">箱</span>';
    return "";
  }

  function run() {
    const args = { randomChoice: state.choice, hiddenEnabled: state.hidden, gates: state.gates,
                   clearFrames: state.clear, delayMap: MAPS.delayBorn,
                   delayOverride: state.delayOverride, const: constsOf() };
    result = CORE.compute(level, args);
    base = constsAreDefault() ? result
      : CORE.compute(level, Object.assign({}, args, { const: {} }));
  }

  const LANES = [
    { t: "SPAWN", label: "SPAWN 出怪", color: "#66bb6a", h: 16 },
    { t: "ACTIVATE_PREDEFINED", label: "ACTIVATE_PREDEFINED", color: "#ffb74d", h: 13 },
    { t: "EMPTY", label: "EMPTY 占位", color: "#6b7280", h: 10 },
    { t: "PREVIEW_CURSOR", label: "PREVIEW_CURSOR（含合成）", color: "#b39ddb", h: 10 },
    { t: "DISPLAY_ENEMY_INFO", label: "DISPLAY_ENEMY_INFO", color: "#80cbc4", h: 10 },
    { t: "OTHER", label: "其它动作（STORY / 无事件类型）", color: "#90a4ae", h: 10 },
  ];
  const HEAD_H = 16, PITCH = 20, AXIS_H = 20;
  const laneKeyOf = e => LANES.some(l => l.t === e.kind) ? e.kind : "OTHER";
  const FRAME_STEPS = [30, 60, 150, 300, 600, 900, 1500, 3000, 6000, 15000];

  function refresh(rebuildPanel) {
    if (!level) return;
    run();
    if (rebuildPanel) renderPanel();
    render();
  }

  function render() {
    if (!level || !result) return;
    const bd = !constsAreDefault();

    const lb = levelLabel();
    $("#totalInfo").textContent = (lb ? lb + " · " : "") + level.levelId + " · 总帧 " +
      result.totalFrames + " (" + fmtT(result.totalFrames) + ")" + (bd ? " · 常数已偏离基准" : "");

    const gt = $("#gates");
    if (gt) result.waves.forEach(w => {
      const a = gt.querySelector('[data-gstart="' + w.index + '"]');
      if (a) a.textContent = "起点 " + w.gateStart;
      const b = gt.querySelector('[data-gout="' + w.index + '"]');
      if (b) b.textContent = "G=" + w.gate + "f" +
        (w.clearFrame != null && w.clearFrame < w.gateStart ? "（清场早于门起点）" : "");
    });

    const px = parseFloat($("#zoom").value);
    const lanes = LANES.filter(l => result.events.some(e => laneKeyOf(e) === l.t));
    const bodyH = HEAD_H + Math.max(lanes.length, 1) * PITCH;
    const laneTop = new Map();
    lanes.forEach((l, i) => laneTop.set(l.t, HEAD_H + i * PITCH + (PITCH - l.h) / 2));
    const avail = Math.max(($("#tlWrap").clientWidth || 900) - 124, 320);
    const W = Math.max(avail, result.totalFrames * px + 60);

    const g = $("#tlGutter");
    g.innerHTML = '<div class="gh"></div>';
    lanes.forEach(l => {
      const d = document.createElement("div");
      d.className = "glane";
      d.style.height = PITCH + "px";
      d.title = l.label;
      d.innerHTML = '<i style="background:' + l.color + '"></i>' + l.label;
      g.appendChild(d);
    });
    const gl = document.createElement("div");
    gl.className = "glane";
    gl.style.height = AXIS_H + "px";
    gl.style.color = "var(--tx)";
    gl.textContent = "帧号 →";
    g.appendChild(gl);

    const tl = $("#tlPlot");
    tl.style.width = W + "px";
    tl.style.height = (bodyH + AXIS_H) + "px";
    tl.innerHTML = "";

    result.waves.forEach(w => {
      const band = document.createElement("div");
      band.className = "waveBand";
      band.style.left = (w.start * px) + "px";
      band.style.width = ((w.end - w.start) * px) + "px";
      band.style.height = bodyH + "px";
      band.innerHTML = '<span class="wl">wave' + w.index + " · 门 " + w.gate + "f" +
        (w.gateMode === "timeout" ? " (≤" + w.gateMax + ")" : "") + "</span>";
      tl.appendChild(band);
    });

    lanes.forEach((l, i) => {
      const d = document.createElement("div");
      d.className = "gline";
      d.style.top = (HEAD_H + i * PITCH) + "px";
      tl.appendChild(d);
    });
    const step = FRAME_STEPS.find(s => s * px >= 56) || FRAME_STEPS[FRAME_STEPS.length - 1];
    const showSec = step * px >= 96;
    for (let f = 0; f <= result.totalFrames; f += step) {
      const v = document.createElement("div");
      v.className = "vline";
      v.style.left = (f * px) + "px";
      v.style.height = bodyH + "px";
      tl.appendChild(v);
      const t = document.createElement("div");
      t.className = "tick";
      t.style.left = (f * px) + "px";
      t.style.top = bodyH + "px";
      t.style.height = AXIS_H + "px";
      t.textContent = f + "f" + (showSec ? " (" + (f / 30) + "s)" : "");
      tl.appendChild(t);
    }

    result.events.forEach(e => {
      const lk = laneKeyOf(e);
      const l = lanes.find(x => x.t === lk);
      if (!l) return;
      const d = document.createElement("div");
      d.className = "ev" + (e.frame === selFrame && e.key === selKey ? " sel" : "");
      d.style.left = (e.frame * px) + "px";
      d.style.top = laneTop.get(lk) + "px";
      d.style.width = Math.max(2, px * 1.2) + "px";
      d.style.height = l.h + "px";
      d.style.background = l.color;
      const un = unitName(e.key);
      const ow = ownerOf(e.wave, e.frag, e.act);
      const info = e.frame + "f · " + fmtT(e.frame) + " · w" + e.wave + "f" + e.frag + "a" + e.act +
        "#" + e.seq + " " + e.kind + " " + (e.key || "") + (un ? " " + un : "") +
        (e.hg ? " · 隐 " + e.hg : "") +
        (ow ? " · 随 " + ow.g + (ow.pk ? " · 包 " + ow.pk : "") : (e.rg ? " · 随 " + e.rg : ""));
      d.title = info;
      d.addEventListener("click", () => {
        selFrame = e.frame; selKey = e.key;
        const ei = $("#evInfo");
        if (ei) ei.textContent = info;
        render();
      });
      tl.appendChild(d);
    });

    const qs = e => e.frame + "|" + e.wave + "|" + e.frag + "|" + e.act + "|" + e.seq;
    const baseQ = new Map(base.events.map(e => [qs(e), e.frame]));
    const gcellOf = (hg, wi, fi, act, rgSelf) => {
      const ow = ownerOf(wi, fi, act);
      const rg = (ow && ow.g) || rgSelf || "", pk = (ow && ow.pk) || "";
      return "<td>" +
        (hg ? '<span class="tag hg">隐 ' + hg + "</span>" : "") +
        (rg ? '<span class="tag rg">随 ' + rg + "</span>" : "") +
        (pk ? '<span class="tag pk">包 ' + pk + "</span>" : "") +
        (!hg && !rg && !pk ? '<span class="dt">—</span>' : "") + "</td>";
    };

    $("#thQdt").style.display = bd ? "" : "none";
    const tb = $("#tbody"); tb.innerHTML = "";
    result.events.slice().sort((a, b) => a.frame - b.frame || (a.wave - b.wave) || (a.frag - b.frag)).forEach((e, n) => {
      const tr = document.createElement("tr");
      tr.className = (e.frame === selFrame && e.key === selKey) ? "hl" : "";
      const bf = baseQ.get(qs(e));
      const dcell = bd ? '<td class="mono dt">' + (bf == null ? "—" : (e.frame - bf >= 0 ? "+" : "") + (e.frame - bf)) + "</td>" : "";
      const un = unitName(e.key);
      tr.innerHTML = "<td>" + (n + 1) + '</td><td class="mono">' + e.frame + '</td><td class="mono">' + fmtT(e.frame) +
        '</td><td class="mono">' + fmtTFee(e.frame) +
        '</td><td class="mono">w' + e.wave + ".f" + e.frag + ".a" + e.act + "#" + e.seq + "</td><td>" + e.kind +
        "</td><td>" + (e.key || "—") + (un ? ' <span class="dt">' + un + "</span>" : "") +
        (isVariant(e.key) ? ' <span class="tag var" title="本关专属别名 → ' + baseKeyOf(e.key) + '">别名</span>' : "") + refTag(e.key) +
        '</td><td class="mono">' + (e.t / 30000).toFixed(2) + "</td><td>" + (e.route == null ? "—" : e.route) +
        "</td><td>" + (e.syn ? "合成" : (e.kind === "SPAWN" ? "出生" : "执行")) + "</td>" + dcell +
        gcellOf(e.hg, e.wave, e.frag, e.act, e.rg);
      tb.appendChild(tr);
    });
    if (result.removedRows.length) {
      const tr = document.createElement("tr"); tr.className = "cat";
      tr.innerHTML = '<td colspan="' + (bd ? 12 : 11) + '">未入队条目（预处理/过滤删除）× ' +
        result.removedRows.length + "</td>";
      tb.appendChild(tr);
    }
    result.removedRows.forEach(r => {
      const tr = document.createElement("tr"); tr.className = "removed";
      tr.innerHTML = '<td>—</td><td class="mono">—</td><td>—</td><td>—</td><td class="mono">w' + r.wave + ".f" + r.frag +
        ".a" + r.act + "</td><td>" + r.type + "</td><td>" + (r.key || "—") +
        (unitName(r.key) ? ' <span class="dt">' + unitName(r.key) + "</span>" : "") +
        '</td><td class="mono">—</td><td>—</td><td class="reason">' + r.reason + "</td>" +
        (bd ? "<td>—</td>" : "") + gcellOf(r.hg, r.wave, r.frag, r.act, r.rg);
      tb.appendChild(tr);
    });

    $("#thSdt").style.display = bd ? "" : "none";
    const stb = $("#tbodyS"); stb.innerHTML = "";
    const sBase = new Map(base.spawnTable.map(r => [r.wave + "|" + r.frag + "|" + r.act + "|" + r.seq, r.frame]));
    result.spawnTable.forEach(r => {
      const bf = sBase.get(r.wave + "|" + r.frag + "|" + r.act + "|" + r.seq);
      const tr = document.createElement("tr");
      tr.className = (r.frame === selFrame && r.key === selKey ? "hl " : "") + (r.tie ? "tie" : "");
      const dcell = bd ? '<td class="mono dt">' + (bf == null ? "—" : (r.frame - bf >= 0 ? "+" : "") + (r.frame - bf)) + "</td>" : "";
      tr.innerHTML = "<td>" + r.n + "</td><td>" + (r.key || "—") +
        (unitName(r.key) ? ' <span class="dt">' + unitName(r.key) + "</span>" : "") + refTag(r.key) +
        '</td><td>' + (r.route == null ? "—" : r.route) +
        '</td><td class="mono">w' + r.wave + ".f" + r.frag + ".a" + r.act + "#" + r.seq +
        '</td><td class="mono">' + r.frame + '</td><td class="mono">' + fmtT(r.frame) +
        '</td><td class="mono">' + fmtTFee(r.frame) +
        '</td><td class="mono">' + (r.delta >= 0 ? "+" : "") + r.delta +
        '</td><td class="tcell">' + (r.tie ? "⚠ 同刻" : "") + "</td>" + dcell;
      stb.appendChild(tr);
    });
    renderMarkdown();
  }

  function renderMarkdown() {
    const rows = result.spawnTable.map(r =>
      "| " + r.n + " | " + (r.key || "") + (unitName(r.key) ? " " + unitName(r.key) : "") + " | " + (r.route == null ? "" : r.route) +
      " | w" + r.wave + ".f" + r.frag + ".a" + r.act + "#" + r.seq + " | " + r.frame + " | " + fmtT(r.frame) +
      " | " + fmtTFee(r.frame) +
      " | " + (r.delta >= 0 ? "+" : "") + r.delta + " | " + (r.tie ? "⚠" : "") + " |");
    $("#mdOut").value = ["| # | 敌人 | 路线 | 波次.兵团.小队 | 帧 | 秒:帧 | 费用条 | Δ | 同刻 |",
      "|---|---|---|---|---|---|---|---|---|", ...rows].join("\n");
  }

  function renderPanel() {
    if (!level) return;
    const rg = $("#randGroups"); rg.innerHTML = "";
    const gs = CORE.groupsOfLevel(level);
    if (!gs.length) rg.innerHTML = '<div class="src">本关无随机组</div>';
    gs.forEach(g => {
      const box = document.createElement("div"); box.className = "grp";
      const total = g.buckets.reduce((s, b) => s + b.weight, 0);
      const multi = g.buckets.some(b => b.packKey);
      const opts = g.buckets.map(b => {
        const first = g.actions[b.members[0]] || {};
        const emp = CORE.isEmptyBucket(g.actions, b);
        const head = b.packKey ? "包 " + b.packKey : (emp ? "(empty)" : (first.actionType || "条目"));
        const tail = [b.packKey ? b.members.length + " 条" : "", "w" + b.weight,
                      emp ? "不出" : (first.key || "")].filter(Boolean).join(" · ");
        return '<option value="' + b.members[0] + '"' +
          (state.choice[g.key] === b.members[0] ? " selected" : "") + ">" +
          head + "  " + tail + (b.packKey ? "" : trapTagOf(level, first.key || "")) + "</option>";
      }).join("");
      box.innerHTML = '<div class="gname">' + g.key + (multi ? "（" + g.buckets.length + " 个包）" : "") +
        '</div><select data-gk="' + g.key + '">' + opts + "</select>" +
        '<div class="meta">权重和 ' + total +
        (multi ? " · 抽中一个包 ⇒ 整包出怪" : " · 抽中一条 ⇒ 只出这条") +
        " · 同名键在不同片段是不同组</div>";
      rg.appendChild(box);
    });
    rg.querySelectorAll("select").forEach(sel => sel.addEventListener("change", () => {
      state.choice[sel.dataset.gk] = parseInt(sel.value, 10); refresh(false);
    }));

    const hg = $("#hiddenGroups"); hg.innerHTML = "";
    const hgs = new Set();
    (level.waves || []).forEach(w => (w.fragments || []).forEach(f => (f.actions || []).forEach(a => {
      if (a.hiddenGroup) hgs.add(a.hiddenGroup);
    })));
    if (!hgs.size) hg.innerHTML = '<div class="src">本关无隐藏组</div>';
    [...hgs].sort().forEach(g => {
      const row = document.createElement("label"); row.className = "hg";
      row.innerHTML = '<input type="checkbox" data-g="' + g + '"' + (state.hidden[g] ? " checked" : "") +
        "><span>" + g + "</span>";
      hg.appendChild(row);
    });
    hg.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
      state.hidden[cb.dataset.g] = cb.checked; refresh(false);
    }));

    const gt = $("#gates"); gt.innerHTML = "";
    result.waves.forEach(w => {
      const row = document.createElement("div"); row.className = "gateRow";
      const lim = w.gateMode === "timeout" ? "上限 " + w.gateMax + "f" : "无限等";
      const cf = state.clear[w.index];
      row.innerHTML = '<span class="gname">wave' + w.index + "</span>" +
        '<span class="gs" data-gstart="' + w.index + '">起点 —</span>清场' +
        '<input type="number" step="0.1" min="0" data-cs="' + w.index + '" placeholder="s" value="' +
        (cf != null ? CORE.frameToSec(cf) : "") + '"><span class="src">s</span>=' +
        '<input type="number" step="1" min="0" data-cf="' + w.index + '" placeholder="f" value="' +
        (cf != null ? cf : "") + '"><span class="src">帧</span>' +
        '<span class="gs" data-gout="' + w.index + '">—</span>' +
        '<span class="src">managed ' + w.managed + " · " + lim + "</span>";
      gt.appendChild(row);
    });
    gt.querySelectorAll("input[data-cs]").forEach(inpS => inpS.addEventListener("input", () => {
      const wi = +inpS.dataset.cs, v = inpS.value.trim();
      const inpF = gt.querySelector('input[data-cf="' + wi + '"]');
      if (v === "" || isNaN(parseFloat(v))) { delete state.clear[wi]; if (inpF) inpF.value = ""; }
      else {
        const fr = CORE.secToFrame(parseFloat(v));
        state.clear[wi] = fr; if (inpF) inpF.value = fr;
      }
      refresh(false);
    }));
    gt.querySelectorAll("input[data-cf]").forEach(inpF => inpF.addEventListener("input", () => {
      const wi = +inpF.dataset.cf, v = inpF.value.trim();
      const inpS = gt.querySelector('input[data-cs="' + wi + '"]');
      if (v === "" || isNaN(parseInt(v, 10))) { delete state.clear[wi]; if (inpS) inpS.value = ""; }
      else {
        const fr = Math.max(0, parseInt(v, 10));
        state.clear[wi] = fr; if (inpS) inpS.value = CORE.frameToSec(fr);
      }
      refresh(false);
    }));

    const ct = $("#consts"); ct.innerHTML = "";
    [["exec", "EXECUTOR_FRAMES", 0, 2, 1], ["handoff", "FRAG_HANDOFF", 0, 4, 1],
     ["pre", "预览提前量(s)", 0, 10, 0.5], ["itv", "预览间隔(s)", 0, 2, 0.1], ["cnt", "预览条数", 0, 4, 1]]
      .forEach(([k, lab, mn, mx, st]) => {
        const row = document.createElement("div"); row.className = "cRow";
        row.innerHTML = "<label>" + lab + '</label><input type="number" data-c="' + k + '" min="' + mn +
          '" max="' + mx + '" step="' + st + '" value="' + state.consts[k] + '">';
        ct.appendChild(row);
      });
    ct.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
      state.consts[inp.dataset.c] = inp.value; refresh(false);
    }));

    const dl = $("#delays"); dl.innerHTML = "";
    if (!result.enemies.length) dl.innerHTML = '<div class="src">本关无 SPAWN 条目</div>';
    result.enemies.forEach(e => {
      const row = document.createElement("div"); row.className = "eRow";
      row.innerHTML = '<span class="k" title="' + e.key + '">' + e.key + ' <span class="src">' +
        e.delay + " · " + e.src + '</span></span><input type="number" step="0.1" min="0" data-ek="' +
        e.key + '" placeholder="' + e.delay + '" value="' +
        (state.delayOverride[e.key] != null ? state.delayOverride[e.key] : "") + '">';
      dl.appendChild(row);
    });
    dl.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
      if (inp.value === "") delete state.delayOverride[inp.dataset.ek];
      else state.delayOverride[inp.dataset.ek] = inp.value;
      refresh(false);
    }));
  }

  function loadLevel(d, key) {
    level = normalize(d, key);
    resetState();
    refresh(true);
  }

  if (window.WAVE_MAPPINGS) useMapsFrom(window.WAVE_MAPPINGS, "wave-mappings.js（同目录自动加载）");
  updateMapStatus();
  $("#mapIn").addEventListener("change", ev => {
    const fs = [...(ev.target.files || [])];
    if (fs.length) importMaps(fs);
    ev.target.value = "";
  });
  $("#mapClear").addEventListener("click", () => {
    MAPS.unitNames = {}; MAPS.delayBorn = {}; MAPS.levelNames = {}; MAPS.trapClass = {};
    mapSrc = null;
    const msg = $("#mapMsg"); if (msg) msg.innerHTML = "";
    updateMapStatus();
    refresh(true);
  });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", async e => {
    e.preventDefault();
    const fs = [...((e.dataTransfer && e.dataTransfer.files) || [])];
    const maps = [], levels = [];
    for (const f of fs) {
      let obj = null;
      try { obj = CORE.parseMappingText(await readText(f)); } catch (err) { obj = null; }
      if (!obj) continue;
      if (obj.waves) levels.push([f, obj]);
      else if (CORE.classifyMapping(obj)) maps.push(f);
    }
    if (maps.length) await importMaps(maps);
    if (levels.length) { const last = levels[levels.length - 1]; loadLevel(last[1], last[0].name); }
    if (!maps.length && !levels.length) alert("拖入的文件既不是关卡 JSON，也认不出是映射表");
  });

  const SAMPLE_GROUP = "__samples__", SEP = "\u0000";
  const sel = $("#sampleSel");
  let INDEX = null;
  const lvText = bare => labelOfKey(bare) || bare;
  const areaLabelOf = a => {
    const e = INDEX && (INDEX.areas || []).find(x => x[0] === a);
    return e ? e[1] : a;
  };
  const setLvMsg = s => { const el = $("#lvMsg"); if (el) el.textContent = s || ""; };
  const opt = (v, t) => {
    const o = document.createElement("option"); o.value = v; o.textContent = t; return o;
  };

  function fillAreaSel() {
    const asel = $("#areaSel");
    asel.innerHTML = "";
    asel.appendChild(opt(SAMPLE_GROUP, "内嵌样例（" + Object.keys(SAMPLES).length + "）"));
    if (INDEX) (INDEX.areas || []).forEach(([k, lab]) => asel.appendChild(opt(k, lab)));
    asel.value = SAMPLE_GROUP;
  }

  function fillLevelSel() {
    sel.innerHTML = "";
    const q = ($("#lvFilter").value || "").trim().toLowerCase();
    const list = [];
    if (q) {
      Object.keys(SAMPLES).forEach(k => {
        if (k.toLowerCase().indexOf(q) >= 0 || lvText(k).toLowerCase().indexOf(q) >= 0)
          list.push([SAMPLE_GROUP, k]);
      });
      if (INDEX) {
        const areas = Object.keys(INDEX.levels || {});
        for (let i = 0; i < areas.length && list.length <= 300; i++) {
          const a = areas[i];
          for (const bare of INDEX.levels[a]) {
            if (list.length > 300) break;
            if (bare.toLowerCase().indexOf(q) >= 0 || lvText(bare).toLowerCase().indexOf(q) >= 0)
              list.push([a, bare]);
          }
        }
      }
    } else {
      const a = $("#areaSel").value;
      const arr = a === SAMPLE_GROUP ? Object.keys(SAMPLES)
                                     : ((INDEX && INDEX.levels && INDEX.levels[a]) || []);
      arr.forEach(bare => list.push([a, bare]));
    }
    if (!list.length) sel.appendChild(opt("", q ? "无匹配" : "（这个分区没有关卡）"));
    list.slice(0, 300).forEach(([a, bare]) => {
      sel.appendChild(opt(a + SEP + bare,
        (q && a !== SAMPLE_GROUP ? areaLabelOf(a) + " · " : "") + lvText(bare)));
    });
    if (q && list.length > 300) setLvMsg("匹配较多，只列前 300 条 —— 再输入几个字符缩小范围");
    else if (!INDEX) setLvMsg("");
  }

  async function openLevel(a, bare) {
    if (!bare) return;
    if (a === SAMPLE_GROUP) { loadLevel(SAMPLES[bare], bare); setLvMsg(""); return; }
    const id = a + "/" + bare;
    setLvMsg("正在取 " + lvText(bare) + " …");
    try {
      const r = await fetch("../data/levels/" + id + ".json", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      loadLevel(await r.json(), id);
      setLvMsg("");
    } catch (e) {
      setLvMsg("✗ 取不到这一关（" + ((e && e.message) || e) +
               "）—— 站点数据要经 http(s) 访问；本地直接双击打开时请改用「导入关卡 JSON」或内嵌样例。");
    }
  }

  fillAreaSel();
  fillLevelSel();
  $("#areaSel").addEventListener("change", () => { $("#lvFilter").value = ""; fillLevelSel(); });
  sel.addEventListener("change", () => {
    const v = sel.value, i = v.indexOf(SEP);
    if (i > 0) openLevel(v.slice(0, i), v.slice(i + 1));
  });
  let lvTimer = null;
  $("#lvFilter").addEventListener("input", () => {
    clearTimeout(lvTimer); lvTimer = setTimeout(fillLevelSel, 150);
  });
  $("#fileIn").addEventListener("change", ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { loadLevel(JSON.parse(rd.result), f.name); } catch (e) { alert("JSON 解析失败: " + e); } };
    rd.readAsText(f);
  });
  $("#zoom").addEventListener("input", render);
  $("#randAll").addEventListener("click", () => {
    CORE.groupsOfLevel(level).forEach(g => {
      let r = Math.random() * g.buckets.reduce((s, b) => s + b.weight, 0);
      let picked = g.buckets[g.buckets.length - 1];
      for (const b of g.buckets) { r -= b.weight; if (r < 0) { picked = b; break; } }
      state.choice[g.key] = picked.members[0];
    });
    refresh(true);
  });
  $("#emptyAll").addEventListener("click", () => {
    state.choice = CORE.defaultChoices(level); refresh(true);
  });
  $("#hgFromRunes").addEventListener("click", () => {
    const en = CORE.groupsFromRunes(level);
    state.hidden = {};
    en.forEach(g => { state.hidden[g] = true; });
    refresh(true);
  });
  $("#constReset").addEventListener("click", () => {
    state.consts = Object.assign({}, DEFUI); refresh(true);
  });
  $("#tabQ").addEventListener("click", () => {
    $("#paneQ").style.display = ""; $("#paneS").style.display = "none";
    $("#tabQ").classList.add("on"); $("#tabS").classList.remove("on");
  });
  $("#tabS").addEventListener("click", () => {
    $("#paneQ").style.display = "none"; $("#paneS").style.display = "";
    $("#tabS").classList.add("on"); $("#tabQ").classList.remove("on");
  });
  $("#mdBtn").addEventListener("click", () => {
    const box = $("#mdBox");
    box.style.display = box.style.display === "none" ? "" : "none";
    const ta = $("#mdOut"); ta.focus(); ta.select();
  });

  const panelEl = $("#panel");
  $("#panelBtn").addEventListener("click", () => { panelEl.classList.toggle("folded"); });
  if (window.matchMedia && window.matchMedia("(max-width:860px)").matches) panelEl.classList.add("folded");

  if (NOTES.length) {
    const seen = {};
    NOTES.forEach(n => { seen[n.id] = 1; });
    const used = {};
    document.querySelectorAll("[data-note]").forEach(el => {
      if (el.dataset && el.dataset.note) used[el.dataset.note] = 1;
    });
    const miss = Object.keys(used).filter(id => !seen[id]);
    if (miss.length) console.warn("正文引用了载荷里没有的说明 id：" + miss.join(", "));
    const extra = NOTES.filter(n => !used[n.id]).map(n => n.id);
    if (extra.length) console.info("仅在「全部说明」出现的说明：" + extra.join(", "));
  } else {
    console.info("未加载说明载荷 wave-notes.js：说明按钮会提示缺条目");
  }

  if (Object.keys(SAMPLES).length) {
    const first = Object.keys(SAMPLES)[0];
    sel.value = SAMPLE_GROUP + SEP + first;
    loadLevel(SAMPLES[first], first);
  }
  (async () => {
    try {
      const r = await fetch("../data/levels-index.json", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const keep = sel.value;
      const touched = $("#areaSel").value !== SAMPLE_GROUP;
      INDEX = await r.json();
      if (!touched) { fillAreaSel(); fillLevelSel(); }
      if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
    } catch (e) {
      setLvMsg("站点关卡数据不可用（" + ((e && e.message) || e) +
               "）—— 现在只有内嵌样例，也可用「导入关卡 JSON」。");
    }
  })();
})();
</script>
</body>
</html>
